---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: teslamate
  namespace: default
spec:
  interval: 1h
  path: ./apps/teslamate/
  prune: true
  sourceRef:
    kind: GitRepository
    name: k8s-infrastructure
    namespace: kube-system
  healthChecks:
    - apiVersion: apps/v1
      kind: StatefulSet
      name: teslamate-postgresql
      namespace: default
    - apiVersion: apps/v1
      kind: Deployment
      name: teslamate
      namespace: default
    - apiVersion: apps/v1
      kind: Deployment
      name: teslamate-grafana
      namespace: default
  postBuild:
    substituteFrom:
      - kind: Secret
        name: secrets
