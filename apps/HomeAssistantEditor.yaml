apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-assistant-editor
  namespace: default
spec:
  dependsOn:
  - name: home-assistant-native
  interval: 10m0s
  retryInterval: 1m0s
  timeout: 5m0s
  path: ./clusters/${CLUSTER_NAME}/home-assistant-editor/
  sourceRef:
    kind: GitRepository
    name: k8s-infrastructure
    namespace: kube-system
  prune: false
  deletionPolicy: Orphan
  force: false
  healthChecks:
  - apiVersion: apps/v1
    kind: Deployment
    name: home-assistant-editor
    namespace: default
