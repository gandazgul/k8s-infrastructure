apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-assistant-native
  namespace: default
spec:
  dependsOn:
  - name: yasr-volume
    namespace: kube-system
  - name: kube-system
    namespace: kube-system
  interval: 10m0s
  retryInterval: 1m0s
  timeout: 3m0s
  path: ./clusters/${CLUSTER_NAME}/home-assistant/
  sourceRef:
    kind: GitRepository
    name: k8s-infrastructure
    namespace: kube-system
  prune: false
  deletionPolicy: Orphan
  force: false
  healthChecks:
  - apiVersion: apps/v1
    kind: Deployment
    name: home-assistant
    namespace: default
