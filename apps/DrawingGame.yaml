---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: drawing-game
  namespace: default
spec:
  interval: 1h
  path: ./apps/generic/overlays/drawing-game/
  prune: true
  sourceRef:
    kind: GitRepository
    name: k8s-infrastructure
    namespace: kube-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: drawing-game
      namespace: default
