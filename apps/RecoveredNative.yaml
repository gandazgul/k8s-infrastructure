apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: recovered-native
  namespace: default
spec:
  dependsOn:
  - name: kube-system
    namespace: kube-system
  - name: main-volume
    namespace: kube-system
  - name: yasr-volume
    namespace: kube-system
  interval: 10m0s
  retryInterval: 1m0s
  timeout: 3m0s
  path: ./clusters/${CLUSTER_NAME}/recovered-native/
  sourceRef:
    kind: GitRepository
    name: k8s-infrastructure
    namespace: kube-system
  prune: false
  deletionPolicy: Orphan
  force: false
  healthChecks:
  - apiVersion: apps/v1
    kind: Deployment
    name: flaresolverr
    namespace: default
  - apiVersion: apps/v1
    kind: Deployment
    name: kokoro-tts
    namespace: default
  - apiVersion: apps/v1
    kind: Deployment
    name: tesla-public-key
    namespace: default
  - apiVersion: apps/v1
    kind: Deployment
    name: freshrss-private
    namespace: default
  - apiVersion: apps/v1
    kind: Deployment
    name: lidarr-public
    namespace: default
  - apiVersion: apps/v1
    kind: Deployment
    name: prowlarr-public
    namespace: default
  - apiVersion: apps/v1
    kind: Deployment
    name: qdrant
    namespace: default
  - apiVersion: apps/v1
    kind: Deployment
    name: searxng
    namespace: default
  - apiVersion: apps/v1
    kind: Deployment
    name: sharry-private
    namespace: default
  - apiVersion: apps/v1
    kind: Deployment
    name: wallabag-private
    namespace: default
  - apiVersion: apps/v1
    kind: Deployment
    name: wyoming-openai
    namespace: default
