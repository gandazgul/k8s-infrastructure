---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flower-shop
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: flower-shop-auth
    nginx.ingress.kubernetes.io/auth-realm: "Flower Shop"
    nginx.ingress.kubernetes.io/satisfy: "any"
    nginx.ingress.kubernetes.io/whitelist-source-range: "10.1.1.0/24"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Preserve the browser's Basic-auth challenge instead of replacing 401s.
    nginx.ingress.kubernetes.io/custom-http-errors: "404,500,503"
    nginx.ingress.kubernetes.io/proxy-body-size: "128k"
    forecastle.stakater.com/appName: "Flower Shop"
    forecastle.stakater.com/expose: "true"
    forecastle.stakater.com/group: "Games"
    forecastle.stakater.com/url: "https://flowers.dumbhome.uk"
