---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: berenstain-bears
spec:
  template:
    spec:
      containers:
        - name: container
          image: harbor.dumbhome.uk/library/berenstain-bears:20261103-pwa-icons@sha256:6d623d3ec3b26798ec1072f068347135f95dcb734161b14896b29bb2e4cfe639
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: ${CLUSTER_TIME_ZONE}
            - name: BASIC_AUTH_USER
              value: ${BEARS_USER}
            - name: BASIC_AUTH_PASS
              value: ${BEARS_PASSWORD}
          livenessProbe:
            httpGet:
              scheme: HTTP
              path: /healthz
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 50Mi
            limits:
              cpu: 200m
              memory: 200Mi
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
