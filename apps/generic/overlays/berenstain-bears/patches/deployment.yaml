---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: berenstain-bears
spec:
  template:
    spec:
      containers:
        - name: container
          image: harbor.dumbhome.uk/library/berenstain-bears:e4fc215@sha256:bd11db8ba0dbce054e13882c51cab99b4b0152a78e15ba65d4d236ab72b5fe4b
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: ${CLUSTER_TIME_ZONE}
            - name: BASIC_AUTH_USER
              value: ${BEARS_USER}
            - name: BASIC_AUTH_PASS
              value: ${BEARS_PASSWORD}
          livenessProbe:
            httpGet:
              scheme: HTTP
              path: /healthz
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 50Mi
            limits:
              cpu: 200m
              memory: 200Mi
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
