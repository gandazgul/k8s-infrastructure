---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drawing-game
spec:
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Saves and drawings stay in each browser, not on shared cluster storage.
      volumes: null
      containers:
        - name: container
          # yamllint disable-line rule:line-length
          image: harbor.dumbhome.uk/library/drawing-game:20261104-install-screenshots@sha256:5f0f7b4e60a43d8e7ac4bf7b52d31f6805dc6247b853be4510f732629791fd70
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              scheme: HTTP
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
