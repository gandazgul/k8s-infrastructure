---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drawing-game
spec:
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Saves and drawings stay in each browser, not on shared cluster storage.
      volumes: null
      containers:
        - name: container
          # yamllint disable-line rule:line-length
          image: harbor.dumbhome.uk/library/drawing-game:20261021-forest-spring-v16@sha256:0e727dd243076a244901312cbaed3fb8ebaab4349e195c51e44cb31be98554ac
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              scheme: HTTP
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
