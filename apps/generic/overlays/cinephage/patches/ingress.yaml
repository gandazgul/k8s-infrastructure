---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinephage
  annotations:
    forecastle.stakater.com/appName: "Cinephage"
    forecastle.stakater.com/expose: "true"
    forecastle.stakater.com/group: "Media"
    forecastle.stakater.com/url: "https://cinema.${CLUSTER_DOMAIN_NAME}"
    nginx.ingress.kubernetes.io/custom-http-errors: "502,503,504"
