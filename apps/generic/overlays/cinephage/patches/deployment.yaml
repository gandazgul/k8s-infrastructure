---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cinephage
spec:
  strategy:
    type: Recreate
  template:
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      containers:
        - name: container
          image: ghcr.io/cinephage/cinephage:0.18.1
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: ${CLUSTER_TIME_ZONE}
            - name: ORIGIN
              value: https://cinema.${CLUSTER_DOMAIN_NAME}
            - name: BETTER_AUTH_URL
              value: https://cinema.${CLUSTER_DOMAIN_NAME}
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: CINEPHAGE_AUTH_SECRET
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: yasr-volume
              mountPath: /config
              subPath: configs/cinephage/
            - name: yasr-volume
              mountPath: /data/downloads
              subPath: configs/transmission/downloads/
            - name: main-volume
              mountPath: /media/movies
              subPath: public/Movies/
            - name: main-volume
              mountPath: /media/tv
              subPath: public/TV/
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: backup-volume
          $patch: delete
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
