apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
spec:
  strategy:
    type: Recreate
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - name: container
          image: n8nio/n8n:2.44.5
          imagePullPolicy: IfNotPresent
          env:
            - name: N8N_DIAGNOSTICS_ENABLED
              value: "false"
            - name: N8N_VERSION_NOTIFICATIONS_ENABLED
              value: "false"
            - name: N8N_TEMPLATES_ENABLED
              value: "false"
            - name: N8N_PERSONALIZATION_ENABLED
              value: "false"
            - name: N8N_HOST
              value: n8n.${CLUSTER_DOMAIN_NAME}
            - name: N8N_PORT
              value: "5678"
            - name: N8N_PROTOCOL
              value: "http"
            - name: N8N_EDITOR_BASE_URL
              value: https://n8n.${CLUSTER_DOMAIN_NAME}/
            - name: N8N_PROXY_HOPS
              value: "1"
            - name: WEBHOOK_URL
              value: https://n8n.${CLUSTER_DOMAIN_NAME}/
            - name: GENERIC_TIMEZONE
              value: ${CLUSTER_TIME_ZONE}
            - name: EXECUTIONS_DATA_PRUNE
              value: "false"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 2Gi
          volumeMounts:
            - name: yasr-volume
              mountPath: /home/node/.n8n
              subPath: configs/n8n/
          livenessProbe:
            httpGet:
              scheme: HTTP
              path: /healthz
              port: http
            initialDelaySeconds: 60
            timeoutSeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              scheme: HTTP
              path: /healthz/readiness
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 10
            periodSeconds: 15
          ports:
            - name: http
              containerPort: 5678
              protocol: TCP
