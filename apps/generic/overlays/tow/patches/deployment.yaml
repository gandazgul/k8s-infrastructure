---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tow
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1993
        runAsGroup: 1993
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: data-permissions
          image: docker.io/library/busybox:1.37.0
          command: ["sh", "-ec"]
          args:
            - >-
              mkdir -p /yasr/configs/tow /backup/apps/tow &&
              chown 1993:1993 /yasr/configs/tow /backup/apps/tow &&
              chmod 700 /yasr/configs/tow /backup/apps/tow
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
          volumeMounts:
            - name: yasr-volume
              mountPath: /yasr
            - name: backup-volume
              mountPath: /backup
      containers:
        - name: container
          image: ghcr.io/gandazgul/chores-app:sha-1bf96e1018f6f44891fca8f047c0821d23982c55@sha256:3363dffb3a1a3a5d6c0d37c4a1837af65dbeb5fff488298918c914a27a649e81
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: DB_PATH
              value: /data/chores.db
            - name: DB_ENV
              value: production
            - name: PUBLIC_ORIGIN
              value: https://todo.${CLUSTER_DOMAIN_NAME}
            - name: ENABLE_AUTH
              value: "true"
            - name: COOKIE_SECURE
              value: "true"
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: TOW_GOOGLE_CLIENT_ID
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: TOW_SESSION_SECRET
            - name: ALLOWED_EMAILS
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: TOW_ALLOWED_EMAILS
            - name: HOUSEHOLD_TZ
              value: ${CLUSTER_TIME_ZONE}
            - name: ENABLE_NOTIFICATIONS
              value: "true"
            - name: NOTIFICATION_PROVIDER
              value: fcm
            - name: FCM_SERVICE_ACCOUNT_FILE
              value: /run/secrets/tow-fcm/service-account.json
            - name: QUIET_HOURS_START
              value: "21:00"
            - name: QUIET_HOURS_END
              value: "08:00"
            - name: POOL_BLAST_LEAD_HOURS
              value: "0"
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: yasr-volume
              mountPath: /data
              subPath: configs/tow
            - name: tmp
              mountPath: /tmp
            - name: fcm-credentials
              mountPath: /run/secrets/tow-fcm
              readOnly: true
      volumes:
        - name: fcm-credentials
          secret:
            secretName: secrets
            defaultMode: 0444
            items:
              - key: TOW_FCM_SERVICE_ACCOUNT_JSON
                path: service-account.json
        - name: main-volume
          $patch: delete
        - name: tmp
          emptyDir: {}
