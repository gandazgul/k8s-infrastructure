---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tow-backup
spec:
  schedule: "0 4 * * *"
  timeZone: ${CLUSTER_TIME_ZONE}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1993
            runAsGroup: 1993
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: backup-permissions
              image: docker.io/library/busybox:1.37.0
              command: ["sh", "-ec"]
              args: ["chown 1993:1993 /backups && chmod 700 /backups"]
              securityContext:
                runAsNonRoot: false
                runAsUser: 0
                runAsGroup: 0
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                  add: ["CHOWN", "FOWNER"]
              volumeMounts:
                - name: backups
                  mountPath: /backups
                  subPath: apps/tow
          containers:
            - name: backup
              image: ghcr.io/gandazgul/chores-app:sha-1bf96e1018f6f44891fca8f047c0821d23982c55@sha256:3363dffb3a1a3a5d6c0d37c4a1837af65dbeb5fff488298918c914a27a649e81
              command: ["sh", "-ec"]
              args:
                - >-
                  deno run -A --cached-only scripts/backup_db.ts
                  "/backups/tow-$(date -u +%Y%m%dT%H%M%SZ).db";
                  find /backups -name 'tow-*.db' -type f -mtime +30 -delete
              env:
                - name: DB_PATH
                  value: /data/chores.db
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: data
                  mountPath: /data
                  subPath: configs/tow
                  readOnly: true
                - name: backups
                  mountPath: /backups
                  subPath: apps/tow
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: yasr-volume
            - name: backups
              persistentVolumeClaim:
                claimName: backup-volume
