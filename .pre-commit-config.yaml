exclude: '^(.idea)$'
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v3.2.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-added-large-files
- repo: local
  hooks:
  - id: unresolved-flux-placeholders
    name: unresolved Flux placeholders
    entry: ./scripts/check-unsubstituted-placeholders.sh
    language: system
    pass_filenames: false
