# Regenerate this file after DOCKERHUB_TOKEN changes.
# This reads credentials from clusters/gandazgul/secrets.env; do not hardcode the token.
# Username uses CLUSTER_NAME. Email uses EMAIL. Password uses DOCKERHUB_TOKEN.
#
#   eval "$(python3 - <<'PY'
#   from pathlib import Path
#   import shlex
#   wanted = {"CLUSTER_NAME", "EMAIL", "DOCKERHUB_TOKEN"}
#   for line in Path("clusters/gandazgul/secrets.env").read_text().splitlines():
#       if not line or line.lstrip().startswith("#") or "=" not in line:
#           continue
#       key, value = line.split("=", 1)
#       if key in wanted:
#           print(f"{key}={shlex.quote(value)}")
#   PY
#   )"
#   for ns in default kube-system monitoring; do
#     kubectl create secret docker-registry dockerhub-creds \
#       --namespace="${ns}" \
#       --docker-server=https://index.docker.io/v1/ \
#       --docker-username="${CLUSTER_NAME}" \
#       --docker-password="${DOCKERHUB_TOKEN}" \
#       --docker-email="${EMAIL}" \
#       --dry-run=client -o yaml \
#     | kubeseal -o yaml
#   done > clusters/gandazgul/sealed-secret/DockerHubCreds.yaml
#
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: dockerhub-creds
  namespace: default
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: dockerhub-creds
      namespace: default
    type: kubernetes.io/dockerconfigjson

---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: dockerhub-creds
  namespace: kube-system
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: dockerhub-creds
      namespace: kube-system
    type: kubernetes.io/dockerconfigjson

---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: dockerhub-creds
  namespace: monitoring
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: dockerhub-creds
      namespace: monitoring
    type: kubernetes.io/dockerconfigjson
