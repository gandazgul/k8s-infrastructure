---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paperless-backup
  namespace: kube-system
spec:
  interval: 1h0m0s
  path: ./infrastructure/cronjob/
  sourceRef:
    kind: GitRepository
    name: k8s-infrastructure
    namespace: kube-system
  prune: true
  targetNamespace: default
  postBuild:
    substitute:
      CRONJOB_NAME: paperless-backup
      NAMESPACE: default
      SCHEDULE: "30 2 * * *"
      IMAGE: docker.io/gandazgul/postgres-backup:latest
  patches:
    - patch: |
        - op: add
          path: /spec/jobTemplate/spec/template/spec/volumes/-
          value:
            name: yasr-volume
            persistentVolumeClaim:
              claimName: yasr-volume
      target:
        kind: CronJob
    - patch: |
        - op: add
          path: /spec/jobTemplate/spec/template/spec/containers/0/env
          value:
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: paperless-db-app
                  key: host
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: paperless-db-app
                  key: dbname
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: paperless-db-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paperless-db-app
                  key: password
            - name: BACKUP_DIR
              value: /backups
            - name: BACKUP_NAME
              value: paperless
            - name: RETENTION_DAYS
              value: "30"
      target:
        kind: CronJob
    - patch: |
        - op: add
          path: /spec/jobTemplate/spec/template/spec/containers/0/volumeMounts/-
          value:
            name: yasr-volume
            mountPath: /backups
            subPath: configs/paperless/database-backups
      target:
        kind: CronJob
