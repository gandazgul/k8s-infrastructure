---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: plex-legacy-movies
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 18Ti
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: plex-legacy-movies
    namespace: default
  local:
    path: /mnt/old-main/public/films
  mountOptions:
  - ro
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - k8s-control-plane
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
