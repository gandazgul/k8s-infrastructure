---
apiVersion: v1
data:
  guard.sh: '#!/bin/bash

    set -eu

    state=${1:-/etc/searxng}

    device=${2:-/yasr-device/b52443c5-0f4b-43a3-a689-b444ea6c3683}

    [ -L "$device" ]

    disk=$(readlink "$device")

    name=${disk##*/}

    major_minor=$(cat /sys/class/block/"$name"/dev)

    major=${major_minor%:*}; minor=${major_minor#*:}

    [ "$(stat -c %d "$state")" = "$((major*256+minor))" ]

    [ -s "$state/settings.yml" ]

    /usr/local/searxng/.venv/bin/python -c ''import sys,yaml; s=yaml.safe_load(open(sys.argv[1])); k=s.get("server",{}).get("secret_key"); assert k and k != "ultrasecretkey"'' "$state/settings.yml"

    '
kind: ConfigMap
metadata:
  name: searxng-recovery-guard-7mhg7cb8kk
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: searxng
  name: searxng
  namespace: default
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
    spec:
      containers:
      - command:
        - /usr/local/searxng/.venv/bin/granian
        - searx.webapp:app
        env:
        - name: GRANIAN_HOST
          value: '::'
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: SEARXNG_BASE_URL
          value: https://search.dumbhome.uk/
        - name: SEARXNG_PORT
          value: '8080'
        image: searxng/searxng@sha256:aa7270053bc3bf92155e2af83e2b0a7c3833c209cdeb8d396861a00c55ee7110
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - /usr/local/searxng/.venv/bin/python
            - -c
            - import urllib.request; assert urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=5).status == 200
          failureThreshold: 3
          initialDelaySeconds: 10
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 10
        name: container
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - /usr/local/searxng/.venv/bin/python
            - -c
            - import urllib.request; assert urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=5).status == 200
          failureThreshold: 3
          initialDelaySeconds: 10
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 10
        resources:
          limits:
            cpu: '1'
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsUser: 0
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/searxng
          name: yasr-volume
          readOnly: true
          subPath: recovery/searxng-20261028/working
        - mountPath: /var/cache/searxng
          name: cache
          subPath: recovery/searxng-20261028/cache
        - mountPath: /tmp
          name: tmp
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - /bin/sh
        - /guard/guard.sh
        image: searxng/searxng@sha256:aa7270053bc3bf92155e2af83e2b0a7c3833c209cdeb8d396861a00c55ee7110
        imagePullPolicy: IfNotPresent
        name: verify-saved-config
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsUser: 0
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/searxng
          name: yasr-volume
          readOnly: true
          subPath: recovery/searxng-20261028/working
        - mountPath: /yasr-device
          name: yasr-device
          readOnly: true
        - mountPath: /guard
          name: guard
          readOnly: true
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - hostPath:
          path: /dev/disk/by-uuid
          type: Directory
        name: yasr-device
      - configMap:
          defaultMode: 365
          name: searxng-recovery-guard-7mhg7cb8kk
        name: guard
      - name: cache
        persistentVolumeClaim:
          claimName: yasr-volume
      - emptyDir: {}
        name: tmp
      - name: yasr-volume
        persistentVolumeClaim:
          claimName: yasr-volume
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: searxng
  name: searxng
  namespace: default
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/name: searxng
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    forecastle.stakater.com/appName: SearXNG
    forecastle.stakater.com/expose: 'true'
    forecastle.stakater.com/group: Tools
    forecastle.stakater.com/icon: https://docs.searxng.org/_static/searxng-wordmark.svg
  labels:
    app.kubernetes.io/name: searxng
  name: searxng
  namespace: default
spec:
  ingressClassName: nginx
  rules:
  - host: search.dumbhome.uk
    http:
      paths:
      - backend:
          service:
            name: searxng
            port:
              name: http
        path: /
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - search.dumbhome.uk
    secretName: internal-ingress-cert
