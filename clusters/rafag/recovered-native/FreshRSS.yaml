---
apiVersion: v1
data:
  guard.sh: "#!/bin/bash\nset -eux\n# This script runs only in the Pod network namespace, never in hostNetwork.\n# The positive control must succeed before a failed connection proves a block.\nnc -w 2 10.101.63.36 8191 </dev/null >/dev/null\nfor tool in iptables ip6tables; do\n    \"${tool}\" -w 5 -P OUTPUT DROP\n    \"${tool}\" -w 5 -P INPUT DROP\n    \"${tool}\" -w 5 -P FORWARD DROP\n    \"${tool}\" -w 5 -F\n    \"${tool}\" -w 5 -A OUTPUT -o lo -j ACCEPT\n    \"${tool}\" -w 5 -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT\n    \"${tool}\" -w 5 -A INPUT -i lo -j ACCEPT\n    \"${tool}\" -w 5 -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT\ndone\n# Approved owner-access exception: actual Traefik Pod only, native HTTP port only.\n# OUTPUT still rejects all NEW connections; replies use conntrack above.\niptables -w 5 -A INPUT -s 10.244.0.4/32 -p tcp --dport 8080 -m conntrack --ctstate NEW -j ACCEPT\nnc -l -p 18765 -e /bin/cat &\nlistener=$!\ntrap 'kill \"${listener}\" 2>/dev/null || true' EXIT\nsleep 1\nreply=$(printf 'private-loopback\\n' | nc -w 2 127.0.0.1 18765)\ntest \"${reply}\" = private-loopback\nif nc -w 2 10.101.63.36 8191 </dev/null >/dev/null 2>&1; then\n    echo 'FAIL: new external connection permitted' >&2\n    exit 1\nfi\n# Require a DROP policy and actual packet hits, not merely a failed probe.\niptables -w 5 -L OUTPUT -n -v | grep -E 'policy DROP [1-9][0-9]* packets'\nip6tables -w 5 -S OUTPUT | grep -Fx -- '-P OUTPUT DROP'\necho 'PASS: loopback allowed; controlled new external TCP blocked; IPv4/IPv6 default DROP'\n"
  start.sh: '#!/bin/bash

    set -e

    cd /var/www/FreshRSS

    test -s data/config.php

    test -s data/users/gollum/db.sqlite

    test -s data/users/gollum/config.php

    php -r ''$c=include "data/config.php"; $u=include "data/users/gollum/config.php"; if ($c["db"]["type"]!=="sqlite" || $c["auth_type"]!=="form" || empty($u["passwordHash"])) exit(1); $d=new PDO("sqlite:data/users/gollum/db.sqlite"); if ($d->query("PRAGMA integrity_check")->fetchColumn()!=="ok" || $d->query("SELECT COUNT(*) FROM feed")->fetchColumn()!=190 || $d->query("SELECT COUNT(*) FROM entry")->fetchColumn()!=9654) exit(1);''

    # Bypass the image entrypoint, cron, updates and extension downloads.

    exec php -S 0.0.0.0:8080 -t /var/www/FreshRSS/p

    '
kind: ConfigMap
metadata:
  name: freshrss-private-guard
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freshrss-private
  namespace: default
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: freshrss-private
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        recovery.dumbhome.uk/public-owner-access: '2026-10-30T03:06:57.485Z'
      labels:
        app: freshrss-private
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - /bin/bash
        - /guard/start.sh
        image: docker.io/freshrss/freshrss@sha256:a003730e81c89abf86c3ca9c8b263c818804734b574469d59586234364f425b0
        imagePullPolicy: IfNotPresent
        name: freshrss
        readinessProbe:
          exec:
            command:
            - php
            - -r
            - exit(@file_get_contents("http://127.0.0.1:8080/i/?c=auth&a=login")===false?1:0);
          failureThreshold: 3
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 4
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 33
          runAsUser: 33
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /guard
          name: guard
          readOnly: true
        - mountPath: /var/www/FreshRSS/data
          name: working
          subPath: data
        - mountPath: /var/www/FreshRSS/extensions
          name: working
          readOnly: true
          subPath: extensions
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - /bin/sh
        - /guard/guard.sh
        image: ghcr.io/flannel-io/flannel@sha256:9aeaf1689ad3554e686d5f4062f33a2ba173398fd8f6d0346bd1dc1a27fb1437
        imagePullPolicy: IfNotPresent
        name: network-guard
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_ADMIN
            drop:
            - ALL
          runAsUser: 0
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /guard
          name: guard
          readOnly: true
      nodeSelector:
        kubernetes.io/hostname: k8s-control-plane
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: freshrss-private-guard
        name: guard
      - hostPath:
          path: /media/yasr/recovery/freshrss-20261030/working/freshrss
          type: Directory
        name: working
---
apiVersion: v1
kind: Service
metadata:
  name: freshrss
  namespace: default
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8080
  selector:
    app: freshrss-private
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
  name: freshrss
  namespace: default
spec:
  ingressClassName: nginx
  rules:
  - host: rss.dumbhome.uk
    http:
      paths:
      - backend:
          service:
            name: freshrss
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - rss.dumbhome.uk
    secretName: internal-ingress-cert
