# Explicit held-Helm boundary: preserve native drift; never unsuspend the sftpgo HelmRelease.
---
apiVersion: v1
data:
  sftpgo.json: '{"data_provider":{"driver":"sqlite","name":"/config/db.sqlite","prefer_database_credentials":true},"ftpd":{"bindings":[{"port":0}]},"sftpd":{"bindings":[{"port":0}]}}'
kind: ConfigMap
metadata:
  annotations:
    meta.helm.sh/release-name: sftpgo
    meta.helm.sh/release-namespace: default
  labels:
    app.kubernetes.io/instance: sftpgo
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: sftpgo
    app.kubernetes.io/version: 2.2.2
    helm.sh/chart: sftpgo-0.12.0
    helm.toolkit.fluxcd.io/name: sftpgo
    helm.toolkit.fluxcd.io/namespace: default
  name: sftpgo
  namespace: default
---
apiVersion: v1
data:
  guard.sh: "#!/bin/bash\nset -eu\nstate=${1:-/config}\ndevice=${2:-/yasr-device/b52443c5-0f4b-43a3-a689-b444ea6c3683}\nsys=${3:-/sys/class/block}\nconfig=${4:-/etc/sftpgo/sftpgo.json}\n[ -d \"${state}\" ]\n[ ! -L \"${state}\" ]\n[ -L \"${device}\" ]\ndisk=$(readlink \"${device}\"); name=${disk##*/}\nmajor_minor=$(cat \"${sys}/${name}/dev\")\nmajor=${major_minor%:*}; minor=${major_minor#*:}\n[ \"$(stat -c %d \"${state}\")\" = \"$((major*256+minor))\" ]\n[ -f \"${state}/db.sqlite\" ]\n[ ! -L \"${state}/db.sqlite\" ]\n[ -s \"${state}/db.sqlite\" ]\n[ -r \"${state}/db.sqlite\" ]\n[ -w \"${state}\" ]\n[ -s \"${config}\" ]\n# Refuse altered base config. Approved SFTP is an explicit env override.\n[ \"$(sha256sum \"${config}\" | cut -d ' ' -f 1)\" = '81a53e9fcf2253f4d9b7c0eeae763a1c6f0985db006d424431be2b873493b407' ]\nif [ \"${state}\" = /config ]; then\n    [ \"$(id -u)\" = 1000 ]\n    [ -f /hostkeys/ssh_host_ed25519_key ]\n    [ ! -L /hostkeys/ssh_host_ed25519_key ]\n    [ \"$(stat -c %a /hostkeys/ssh_host_ed25519_key)\" = 600 ]\n    [ \"$(stat -c %u /hostkeys/ssh_host_ed25519_key)\" = 1000 ]\n    awk '$5==\"/hostkeys\" && $6 ~ /(^|,)ro(,|$)/ {ok=1} END {exit !ok}' /proc/self/mountinfo\n    main_device=$(readlink /yasr-device/e1e00f55-7a88-4deb-a093-9ff8ce800c03)\n    main_name=${main_device##*/}\n    main_mm=$(cat \"/sys/class/block/${main_name}/dev\")\n    main_major=${main_mm%:*}; main_minor=${main_mm#*:}\n    for path in /data/rafag /data/angela /media/main/public /data/public; do\n        [ -d \"${path}\" ]\n        [ \"$(stat -c %d \"${path}\")\" = \"$((main_major*256+main_minor))\" ]\n        awk -v p=\"${path}\" '$5==p && $6 ~ /(^|,)rw(,|$)/ {ok=1} END {exit !ok}' /proc/self/mountinfo\n    done\n    [ \"$(stat -c %d /source-config)\" = \"$((major*256+minor))\" ]\n    awk '$5==\"/source-config\" && $6 ~ /(^|,)ro(,|$)/ {ok=1} END {exit !ok}' /proc/self/mountinfo\nfi\n"
  network-guard.sh: "#!/bin/bash\nset -eux\n# This script runs only in the Pod network namespace, never in hostNetwork.\n# The positive control must succeed before a failed connection proves a block.\nnc -w 2 10.101.63.36 8191 </dev/null >/dev/null\nfor tool in iptables ip6tables; do\n    \"${tool}\" -w 5 -P OUTPUT DROP\n    \"${tool}\" -w 5 -P INPUT DROP\n    \"${tool}\" -w 5 -P FORWARD DROP\n    \"${tool}\" -w 5 -F\n    \"${tool}\" -w 5 -A OUTPUT -o lo -j ACCEPT\n    \"${tool}\" -w 5 -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT\n    \"${tool}\" -w 5 -A INPUT -i lo -j ACCEPT\n    \"${tool}\" -w 5 -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT\ndone\n# Approved normal HTTP/WebDAV: actual Traefik Pod only.\n# OUTPUT still rejects all NEW connections; replies use conntrack above.\niptables -w 5 -A INPUT -s 10.244.0.4/32 -p tcp --dport 8080 -j ACCEPT\niptables -w 5 -A INPUT -s 10.244.0.4/32 -p tcp --dport 8081 -j ACCEPT\n# LAN SFTP only. NodePort uses Local traffic policy to preserve source.\niptables -w 5 -A INPUT -s 10.1.1.0/24 -p tcp --dport 2022 -j ACCEPT\n# Readiness and liveness are exec probes on loopback10000, not node TCP probes.\nnc -l -p 18765 -e /bin/cat &\nlistener=$!\ntrap 'kill \"${listener}\" 2>/dev/null || true' EXIT\nsleep 1\nreply=$(printf 'private-loopback\\n' | nc -w 2 127.0.0.1 18765)\ntest \"${reply}\" = private-loopback\nif nc -w 2 10.101.63.36 8191 </dev/null >/dev/null 2>&1; then\n    echo 'FAIL: new external connection permitted' >&2\n    exit 1\nfi\n# Require a DROP policy and actual packet hits, not merely a failed probe.\niptables -w 5 -L OUTPUT -n -v | grep -E 'policy DROP [1-9][0-9]* packets'\nip6tables -w 5 -S OUTPUT | grep -Fx -- '-P OUTPUT DROP'\necho 'PASS: loopback allowed; controlled new external TCP blocked; IPv4/IPv6 default DROP'\n"
kind: ConfigMap
metadata:
  name: sftpgo-execution-guard
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    recovery.dumbhome.uk/state: normal-http-webdav-lan-sftp-new-identity
  name: sftpgo
  namespace: default
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: sftpgo
      app.kubernetes.io/name: sftpgo
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: sftpgo
        app.kubernetes.io/name: sftpgo
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - /bin/bash
        - -ec
        - /bin/bash /guard/guard.sh; exec /usr/local/bin/sftpgo serve --config-dir /etc/sftpgo
        env:
        - name: TZ
          value: America/New_York
        - name: SFTPGO_SFTPD__BINDINGS__0__ADDRESS
          value: 0.0.0.0
        - name: SFTPGO_SFTPD__BINDINGS__0__PORT
          value: '2022'
        - name: SFTPGO_SFTPD__HOST_KEYS
          value: /hostkeys/ssh_host_ed25519_key
        - name: SFTPGO_HTTPD__BINDINGS__0__ADDRESS
          value: 0.0.0.0
        - name: SFTPGO_HTTPD__BINDINGS__0__PORT
          value: '8080'
        - name: SFTPGO_WEBDAVD__BINDINGS__0__ADDRESS
          value: 0.0.0.0
        - name: SFTPGO_WEBDAVD__BINDINGS__0__PORT
          value: '8081'
        - name: SFTPGO_TELEMETRY__BIND_ADDRESS
          value: 127.0.0.1
        - name: SFTPGO_TELEMETRY__BIND_PORT
          value: '10000'
        image: ghcr.io/drakkan/sftpgo@sha256:3016b086b12e541bfcce037f79ab4f303901e1dc653c381b217f83fea3f80603
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - /bin/bash
            - -ec
            - exec 3<>/dev/tcp/127.0.0.1/10000; printf "GET /healthz HTTP/1.0\r\n\r\n" >&3; read -r line <&3; [[ "$line" == *" 200 "* ]]
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: sftpgo
        ports:
        - containerPort: 2022
          name: sftp
          protocol: TCP
        - containerPort: 8081
          name: webdav
          protocol: TCP
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 10000
          name: telemetry
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - /bin/bash
            - -ec
            - exec 3<>/dev/tcp/127.0.0.1/10000; printf "GET /healthz HTTP/1.0\r\n\r\n" >&3; read -r line <&3; [[ "$line" == *" 200 "* ]]
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 1000
          runAsUser: 1000
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/sftpgo
          name: config
          readOnly: true
        - mountPath: /hostkeys
          name: yasr-volume
          readOnly: true
          subPath: configs/sftpgo-hostkeys
        - mountPath: /config
          name: yasr-volume
          subPath: recovery/sftpgo-20261029/working
        - mountPath: /source-config
          name: yasr-volume
          readOnly: true
          subPath: configs/sftpgo
        - mountPath: /yasr-device
          name: yasr-device
          readOnly: true
        - mountPath: /guard
          name: guard
          readOnly: true
        - mountPath: /data/rafag
          name: main-volume
          subPath: rafag
        - mountPath: /data/angela
          name: main-volume
          subPath: angela
        - mountPath: /media/main/public
          name: main-volume
          subPath: public
        - mountPath: /data/public
          name: main-volume
          subPath: public
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - /bin/sh
        - /guard/network-guard.sh
        image: ghcr.io/flannel-io/flannel@sha256:9aeaf1689ad3554e686d5f4062f33a2ba173398fd8f6d0346bd1dc1a27fb1437
        imagePullPolicy: IfNotPresent
        name: network-guard
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_ADMIN
            drop:
            - ALL
          runAsUser: 0
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /guard
          name: guard
          readOnly: true
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: sftpgo
      serviceAccountName: sftpgo
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: sftpgo
        name: config
      - name: main-volume
        persistentVolumeClaim:
          claimName: main-volume
      - name: yasr-volume
        persistentVolumeClaim:
          claimName: yasr-volume
      - hostPath:
          path: /dev/disk/by-uuid
          type: Directory
        name: yasr-device
      - configMap:
          defaultMode: 365
          name: sftpgo-execution-guard
        name: guard
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    meta.helm.sh/release-name: sftpgo
    meta.helm.sh/release-namespace: default
  labels:
    app.kubernetes.io/instance: sftpgo
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: sftpgo
    app.kubernetes.io/version: 2.2.2
    helm.sh/chart: sftpgo-0.12.0
    helm.toolkit.fluxcd.io/name: sftpgo
    helm.toolkit.fluxcd.io/namespace: default
  name: sftpgo
  namespace: default
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - appProtocol: http
    name: http
    port: 80
    protocol: TCP
    targetPort: http
  - appProtocol: webdav
    name: webdav
    port: 81
    protocol: TCP
    targetPort: webdav
  - appProtocol: http
    name: telemetry
    port: 10000
    protocol: TCP
    targetPort: telemetry
  selector:
    app.kubernetes.io/instance: sftpgo
    app.kubernetes.io/name: sftpgo
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: sftpgo-lan-sftp
  namespace: default
spec:
  externalTrafficPolicy: Local
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: sftp
    nodePort: 30222
    port: 2022
    protocol: TCP
    targetPort: sftp
  selector:
    app.kubernetes.io/instance: sftpgo
    app.kubernetes.io/name: sftpgo
  sessionAffinity: None
  type: NodePort
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sftpgo-owner-http-held
  namespace: default
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`sftpgo.dumbhome.uk`)
    services:
    - name: sftpgo
      port: http
  tls:
    secretName: internal-ingress-cert
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sftpgo-owner-http-redirect
  namespace: default
spec:
  entryPoints:
  - web
  routes:
  - kind: Rule
    match: Host(`sftpgo.dumbhome.uk`) || Host(`webdav.dumbhome.uk`)
    middlewares:
    - name: sftpgo-https
    services:
    - name: sftpgo
      port: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sftpgo-https
  namespace: default
spec:
  redirectScheme:
    permanent: true
    scheme: https
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sftpgo-webdav
  namespace: default
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`webdav.dumbhome.uk`)
    services:
    - name: sftpgo
      port: webdav
  tls:
    secretName: internal-ingress-cert
