---
apiVersion: v1
data:
  network-guard.sh: "#!/bin/bash\nset -eu\n# Pod namespace only. No host firewall change. Saved HTTPS APIs and dynamic RSS.\nfor tool in iptables ip6tables; do\n    \"${tool}\" -w 5 -P OUTPUT DROP\n    \"${tool}\" -w 5 -P INPUT DROP\n    \"${tool}\" -w 5 -P FORWARD DROP\n    \"${tool}\" -w 5 -F\n    \"${tool}\" -w 5 -A OUTPUT -o lo -j ACCEPT\n    \"${tool}\" -w 5 -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT\n    \"${tool}\" -w 5 -A INPUT -i lo -j ACCEPT\n    \"${tool}\" -w 5 -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT\n    \"${tool}\" -w 5 -A OUTPUT -p tcp --dport 443 -j ACCEPT\ndone\n# Saved native SFTP credential target; no general SSH/LAN permission.\n# The export workflow stays held until its saved storage is verified.\niptables -w 5 -A OUTPUT -d 10.1.1.10/32 -p tcp --dport 22 -j ACCEPT\n# Verified kube-dns ClusterIP.\nfor protocol in udp tcp; do\n    iptables -w 5 -A OUTPUT -d 10.96.0.10/32 -p \"${protocol}\" --dport 53 -j ACCEPT\ndone\niptables -w 5 -A INPUT -s 10.244.0.1/32 -p tcp --dport 5678 -j ACCEPT\niptables -w 5 -A INPUT -s 10.244.0.4/32 -p tcp --dport 5678 -j ACCEPT\n"
  start.cjs: "const fs = require('node:fs');\nconst { spawnSync } = require('node:child_process');\nconst UUID = 'b52443c5-0f4b-43a3-a689-b444ea6c3683';\nfunction guard({ mounted, key, savedKey, size, approved, active, published }) {\n    if (!mounted || size <= 0) throw Error('Storage identity refused');\n    if (!key || !savedKey || key !== savedKey) throw Error('Existing encryption key identity refused');\n    if (active.some(id => !approved.includes(id)) || published.some(id => !approved.includes(id))) throw Error('Unapproved activation refused');\n    if (JSON.stringify([...active].sort()) !== JSON.stringify([...published].sort())) throw Error('Publication mismatch refused');\n}\nmodule.exports = { guard };\nif (require.main === module) {\n    const { DatabaseSync } = require('node:sqlite');\n    const root = '/home/node/.n8n';\n    const device = fs.readlinkSync(`/host-uuid/${UUID}`).split('/').pop();\n    const mounted = fs.readFileSync('/host-mountinfo', 'utf8').split('\\n').some(line =>\n        line.includes(' /media/yasr rw,') && line.includes(` - xfs /dev/${device} rw,`));\n    const db = new DatabaseSync(`${root}/database.sqlite`, { readOnly: true });\n    const ids = sql => db.prepare(sql).all().map(row => row.id);\n    const approved = JSON.parse(fs.readFileSync(`${root}/normal-operation.json`, 'utf8')).approved;\n    guard({ mounted, key: process.env.N8N_ENCRYPTION_KEY,\n        savedKey: JSON.parse(fs.readFileSync(`${root}/config`, 'utf8')).encryptionKey,\n        size: fs.statSync(`${root}/database.sqlite`).size, approved,\n        active: ids('SELECT id FROM workflow_entity WHERE active != 0'),\n        published: ids('SELECT id FROM workflow_entity WHERE activeVersionId IS NOT NULL') });\n    db.close();\n    console.log('PASS original storage/key and approved activation subset; normal native runtime');\n    const result = spawnSync('/usr/local/bin/n8n', ['start'], { stdio: 'inherit', env: process.env });\n    process.exit(result.status ?? 1);\n}\n"
kind: ConfigMap
metadata:
  name: n8n-private-guard
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-private
  namespace: default
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: n8n-private
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-10-30T19:56:45-04:00'
      labels:
        app: n8n-private
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - node
        - /guard/start.cjs
        env:
        - name: N8N_DIAGNOSTICS_ENABLED
          value: 'false'
        - name: N8N_VERSION_NOTIFICATIONS_ENABLED
          value: 'false'
        - name: N8N_TEMPLATES_ENABLED
          value: 'false'
        - name: N8N_PERSONALIZATION_ENABLED
          value: 'false'
        - name: N8N_RUNNERS_MODE
          value: internal
        - name: N8N_RUNNERS_BROKER_LISTEN_ADDRESS
          value: 127.0.0.1
        - name: N8N_HOST
          value: n8n.dumbhome.uk
        - name: N8N_PROTOCOL
          value: http
        - name: N8N_EDITOR_BASE_URL
          value: https://n8n.dumbhome.uk/
        - name: N8N_PROXY_HOPS
          value: '1'
        - name: N8N_PORT
          value: '5678'
        - name: WEBHOOK_URL
          value: https://n8n.dumbhome.uk/
        - name: GENERIC_TIMEZONE
          value: America/New_York
        - name: N8N_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              key: encryption-key
              name: n8n-private-existing-key
        - name: EXECUTIONS_DATA_PRUNE
          value: 'false'
        image: docker.io/n8nio/n8n@sha256:b4a4adb0f35d8f86eede56ebd7ae36892e25758ffc0276df14f2c69c111aac48
        imagePullPolicy: IfNotPresent
        name: n8n
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz/readiness
            port: 5678
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 3
        resources:
          limits:
            cpu: '2'
            memory: 2Gi
          requests:
            cpu: 200m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 1000
          runAsUser: 1000
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /home/node/.n8n
          name: working
          subPath: recovery/n8n-editor-20261030-native/state
        - mountPath: /guard
          name: guard
          readOnly: true
        - mountPath: /host-uuid
          name: host-uuid
          readOnly: true
        - mountPath: /host-mountinfo
          name: host-mountinfo
          readOnly: true
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - /bin/sh
        - /guard/network-guard.sh
        image: ghcr.io/flannel-io/flannel@sha256:9aeaf1689ad3554e686d5f4062f33a2ba173398fd8f6d0346bd1dc1a27fb1437
        imagePullPolicy: IfNotPresent
        name: network-guard
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_ADMIN
            drop:
            - ALL
          runAsUser: 0
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /guard
          name: guard
          readOnly: true
      nodeSelector:
        kubernetes.io/hostname: k8s-control-plane
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: working
        persistentVolumeClaim:
          claimName: yasr-volume
      - configMap:
          defaultMode: 420
          name: n8n-private-guard
        name: guard
      - hostPath:
          path: /dev/disk/by-uuid
          type: Directory
        name: host-uuid
      - hostPath:
          path: /proc/1/mountinfo
          type: File
        name: host-mountinfo
---
apiVersion: v1
kind: Service
metadata:
  name: n8n-read-only
  namespace: default
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 5678
    protocol: TCP
    targetPort: 5678
  selector:
    app: n8n-private
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: n8n-http
  namespace: default
spec:
  entryPoints:
  - web
  routes:
  - kind: Rule
    match: Host(`n8n.dumbhome.uk`)
    middlewares:
    - name: n8n-https
    services:
    - name: n8n-read-only
      nativeLB: false
      port: 5678
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: n8n-https
  namespace: default
spec:
  redirectScheme:
    permanent: true
    scheme: https
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: n8n-read-only
  namespace: default
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`n8n.dumbhome.uk`)
    services:
    - name: n8n-read-only
      nativeLB: false
      port: 5678
  tls:
    secretName: internal-ingress-cert
