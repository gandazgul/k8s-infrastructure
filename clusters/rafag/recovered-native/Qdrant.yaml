---
apiVersion: v1
data:
  guard.sh: '#!/bin/bash

    set -eu

    # Read-only startup checks. The deployment task must create the protected baseline.

    state=${1:-/qdrant/storage}

    device=${2:-/yasr-device/b52443c5-0f4b-43a3-a689-b444ea6c3683}

    [ -d "${state}" ] && [ ! -L "${state}" ]

    [ -L "${device}" ]

    disk=$(readlink "${device}")

    name=${disk##*/}

    major_minor=$(cat /sys/class/block/"${name}"/dev)

    major=${major_minor%:*}; minor=${major_minor#*:}

    [ "$(stat -c %d "${state}")" = "$((major*256+minor))" ]

    marker=${state}/.owner-approved-empty-baseline

    [ -f "${marker}" ] && [ ! -L "${marker}" ]

    [ "$(cat "${marker}")" = ''qdrant-only|2026-10-28T22:33:19.209Z|b52443c5-0f4b-43a3-a689-b444ea6c3683|configs/qdrant|historical-vectors-not-restored'' ]

    [ -w "${state}" ]

    # Missing collections is allowed ONLY with the exact owner baseline above.

    # No mkdir, chown, relabel, database write or marker creation is done here.

    '
kind: ConfigMap
metadata:
  name: qdrant-fresh-bootstrap-guard-md269h67k5
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: qdrant
  name: qdrant
  namespace: default
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant
    spec:
      containers:
      - command:
        - /bin/bash
        - -ec
        - /bin/bash /guard/guard.sh; cd /qdrant; exec ./entrypoint.sh
        envFrom:
        - secretRef:
            name: secrets
        image: ghcr.io/qdrant/qdrant/qdrant@sha256:975b390833f6c0b2fc032bb962254c1733a88b7fd0e879b4642cd11c84f7c6d7
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        name: container
        ports:
        - containerPort: 6333
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 250Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 0
          runAsUser: 0
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /qdrant/storage
          name: yasr-volume
          subPath: configs/qdrant
        - mountPath: /yasr-device
          name: yasr-device
          readOnly: true
        - mountPath: /guard
          name: guard
          readOnly: true
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: k8s-control-plane
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - hostPath:
          path: /dev/disk/by-uuid
          type: Directory
        name: yasr-device
      - configMap:
          defaultMode: 365
          name: qdrant-fresh-bootstrap-guard-md269h67k5
        name: guard
      - name: yasr-volume
        persistentVolumeClaim:
          claimName: yasr-volume
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: qdrant
  name: qdrant
  namespace: default
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 6333
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/name: qdrant
  sessionAffinity: None
  type: ClusterIP
