---
apiVersion: v1
data:
  check.php: "<?php\n// Refuse a missing or empty database before PDO can create one.\n$path = '/var/www/wallabag/data/db/wallabag.sqlite';\nif (!is_file($path) || filesize($path) === 0) { exit(1); }\n$db = new PDO('sqlite:' . $path);\n$db->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);\nif ($db->query('PRAGMA integrity_check')->fetchColumn() !== 'ok') { exit(1); }\nforeach (['wallabag_user'=>1, 'wallabag_entry'=>7, 'wallabag_tag'=>3, 'wallabag_config'=>1, 'migration_versions'=>46] as $table=>$count) {\n    if ((int)$db->query('SELECT COUNT(*) FROM ' . $table)->fetchColumn() !== $count) { exit(1); }\n}\n// All tables, including article content, verifiers, tokens and settings.\nforeach ($db->query('SELECT name FROM sqlite_master WHERE type=\"table\" ORDER BY name')->fetchAll(PDO::FETCH_COLUMN) as $table) {\n    $rows = $db->query('SELECT * FROM \"' . $table . '\" ORDER BY rowid')->fetchAll(PDO::FETCH_ASSOC);\n    echo $table, ' ', count($rows), ' ', hash('sha256', serialize($rows)), \"\\n\";\n}\n"
  guard.sh: "#!/bin/bash\nset -eux\n# This script runs only in the Pod network namespace, never in hostNetwork.\n# The positive control must succeed before a failed connection proves a block.\nnc -w 2 10.101.63.36 8191 </dev/null >/dev/null\nfor tool in iptables ip6tables; do\n    \"${tool}\" -w 5 -P OUTPUT DROP\n    \"${tool}\" -w 5 -P INPUT DROP\n    \"${tool}\" -w 5 -P FORWARD DROP\n    \"${tool}\" -w 5 -F\n    \"${tool}\" -w 5 -A OUTPUT -o lo -j ACCEPT\n    \"${tool}\" -w 5 -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT\n    \"${tool}\" -w 5 -A INPUT -i lo -j ACCEPT\n    \"${tool}\" -w 5 -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT\ndone\n# Approved owner-access exception: actual Traefik Pod only, native HTTP port only.\n# OUTPUT still rejects all NEW connections; replies use conntrack above.\niptables -w 5 -A INPUT -s 10.244.0.4/32 -p tcp --dport 80 -m conntrack --ctstate NEW -j ACCEPT\nnc -l -p 18765 -e /bin/cat &\nlistener=$!\ntrap 'kill \"${listener}\" 2>/dev/null || true' EXIT\nsleep 1\nreply=$(printf 'private-loopback\\n' | nc -w 2 127.0.0.1 18765)\ntest \"${reply}\" = private-loopback\nif nc -w 2 10.101.63.36 8191 </dev/null >/dev/null 2>&1; then\n    echo 'FAIL: new external connection permitted' >&2\n    exit 1\nfi\n# Require a DROP policy and actual packet hits, not merely a failed probe.\niptables -w 5 -L OUTPUT -n -v | grep -E 'policy DROP [1-9][0-9]* packets'\nip6tables -w 5 -S OUTPUT | grep -Fx -- '-P OUTPUT DROP'\necho 'PASS: loopback allowed; controlled new external TCP blocked; IPv4/IPv6 default DROP'\n"
  start.sh: '#!/bin/sh

    set -e

    cd /var/www/wallabag

    test -s data/site-credentials-secret-key.txt

    php /guard/check.php

    # Native template rendering only. Never run install, migrations, composer or workers.

    envsubst < /etc/wallabag/parameters.template.yml > app/config/parameters.yml

    envsubst < /etc/wallabag/php-wallabag.template.ini > /etc/php81/conf.d/50_wallabag.ini

    sed -i ''s/listen \[::\]:80 ipv6only=off;/listen 0.0.0.0:80;/'' /etc/nginx/nginx.conf

    grep -F ''listen 0.0.0.0:80;'' /etc/nginx/nginx.conf

    # These are the two native web services, with no queue consumer or scheduler.

    test "$(ls /etc/s6 | sort | tr ''\n'' '' '')" = ''nginx php-fpm ''

    rm -rf var/cache

    exec s6-svscan /etc/s6/

    '
kind: ConfigMap
metadata:
  name: wallabag-private-guard
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallabag-private
  namespace: default
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: wallabag-private
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        recovery.dumbhome.uk/public-owner-access: '2026-10-30T03:06:57.485Z'
      labels:
        app: wallabag-private
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - /bin/sh
        - /guard/start.sh
        env:
        - name: SYMFONY__ENV__DATABASE_DRIVER
          value: pdo_sqlite
        - name: SYMFONY__ENV__DATABASE_NAME
          value: wallabag
        - name: SYMFONY__ENV__DATABASE_TABLE_PREFIX
          value: wallabag_
        - name: SYMFONY__ENV__DOMAIN_NAME
          value: https://wallabag.dumbhome.uk
        - name: SYMFONY__ENV__SERVER_NAME
          value: Wallabag
        - name: POPULATE_DATABASE
          value: 'false'
        image: docker.io/wallabag/wallabag@sha256:82ade66b403d67c05732f9f08003034509f6499e9f487b858c0b77524b28545d
        imagePullPolicy: IfNotPresent
        name: wallabag
        readinessProbe:
          exec:
            command:
            - php
            - -r
            - exit(@file_get_contents("http://127.0.0.1/login")===false?1:0);
          failureThreshold: 3
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 4
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - SETUID
            - SETGID
            - CHOWN
            - DAC_OVERRIDE
            - NET_BIND_SERVICE
            drop:
            - ALL
          runAsUser: 0
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /guard
          name: guard
          readOnly: true
        - mountPath: /var/www/wallabag/data
          name: working
          subPath: recovery/wallabag-20261030/working/wallabag/data
        - mountPath: /var/www/wallabag/web/assets/images
          name: working
          subPath: recovery/wallabag-20261030/working/wallabag/images
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - /bin/sh
        - /guard/guard.sh
        image: ghcr.io/flannel-io/flannel@sha256:9aeaf1689ad3554e686d5f4062f33a2ba173398fd8f6d0346bd1dc1a27fb1437
        imagePullPolicy: IfNotPresent
        name: network-guard
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_ADMIN
            drop:
            - ALL
          runAsUser: 0
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /guard
          name: guard
          readOnly: true
      nodeSelector:
        kubernetes.io/hostname: k8s-control-plane
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: wallabag-private-guard
        name: guard
      - name: working
        persistentVolumeClaim:
          claimName: yasr-volume
---
apiVersion: v1
kind: Service
metadata:
  name: wallabag
  namespace: default
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: wallabag-private
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
  name: wallabag
  namespace: default
spec:
  ingressClassName: nginx
  rules:
  - host: wallabag.dumbhome.uk
    http:
      paths:
      - backend:
          service:
            name: wallabag
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - wallabag.dumbhome.uk
    secretName: internal-ingress-cert
