---
apiVersion: v1
data:
  com.tesla.3p.public-key.pem: '-----BEGIN PUBLIC KEY-----

    MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEh5ur3PRFsJ16HmHd8IWU92GbyUbZ

    QrQu2OShB+CkScC7cH+12mL9YHVP9PR3IeyMW1RJJufigVgL33bzMpvwqQ==

    -----END PUBLIC KEY-----

    '
immutable: true
kind: ConfigMap
metadata:
  name: tesla-public-key
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: tesla-public-key
  name: tesla-public-key
  namespace: default
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tesla-public-key
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        checksum/public-key: 788dc4adc61bf43151ee66ef799b63e70fb668cbfcd17e7848d6f9167c73a05e
      labels:
        app.kubernetes.io/name: tesla-public-key
    spec:
      containers:
      - image: docker.io/library/nginx@sha256:35cd77497979abe70dc8d26f5ae60811eea233a2eb5dc03c2ee30972caeb303e
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /.well-known/appspecific/com.tesla.3p.public-key.pem
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        name: container
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /.well-known/appspecific/com.tesla.3p.public-key.pem
            port: http
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 16Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /usr/share/nginx/html/.well-known/appspecific/com.tesla.3p.public-key.pem
          name: pubkey
          readOnly: true
          subPath: com.tesla.3p.public-key.pem
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/arch: amd64
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: tesla-public-key
        name: pubkey
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: tesla-public-key
  name: tesla-public-key
  namespace: default
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/name: tesla-public-key
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    app.kubernetes.io/name: tesla-public-key
  name: tesla-public-key
  namespace: default
spec:
  ingressClassName: nginx
  rules:
  - host: tesla.dumbhome.uk
    http:
      paths:
      - backend:
          service:
            name: tesla-public-key
            port:
              name: http
        path: /.well-known/appspecific/com.tesla.3p.public-key.pem
        pathType: Exact
  tls:
  - hosts:
    - tesla.dumbhome.uk
    secretName: internal-ingress-cert
