---
# rafag-only: "Vault" is the new 14TB disk and the source of truth for all data
# (shows, music, photos, rafag/, angela/, ...). It is mounted at /media/vault.
# main-volume (/media/main) is the old disk and only holds public/films plus a
# backup/ folder with the old mirror. Same shared PV/PVC template as the other volumes.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vault-volume
  namespace: kube-system
spec:
  interval: 10m0s
  path: ./infrastructure/storage/hdd/
  sourceRef:
    kind: GitRepository
    name: k8s-infrastructure
    namespace: kube-system
  prune: true
  postBuild:
    substitute:
      VOLUME_NAME: vault-volume
      VOLUME_CAPACITY: 12Ti
      VOLUME_STORAGE_CLASS: hdd
      VOLUME_PATH: /media/vault
      NAMESPACE: default
