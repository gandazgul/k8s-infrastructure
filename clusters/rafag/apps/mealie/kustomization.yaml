# Existing shared app flow with Rafag-specific patches and startup safeguards.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../../apps/generic/overlays/mealie
configMapGenerator:
- name: mealie-private-guard
  namespace: default
  literals:
  - |
    guard.sh=#!/bin/bash
    set -eux
    # This script runs only in the Pod network namespace, never in hostNetwork.
    # The positive control must succeed before a failed connection proves a block.
    nc -w 2 10.101.63.36 8191 </dev/null >/dev/null
    for tool in iptables ip6tables; do
        "${tool}" -w 5 -P OUTPUT DROP
        "${tool}" -w 5 -P INPUT DROP
        "${tool}" -w 5 -P FORWARD DROP
        "${tool}" -w 5 -F
        "${tool}" -w 5 -A OUTPUT -o lo -j ACCEPT
        "${tool}" -w 5 -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
        "${tool}" -w 5 -A INPUT -i lo -j ACCEPT
        "${tool}" -w 5 -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
    done
    # Approved owner-access exception: actual Traefik Pod only, native HTTP port only.
    # OUTPUT still rejects all NEW connections; replies use conntrack above.
    iptables -w 5 -A INPUT -s 10.244.0.4/32 -p tcp --dport 9000 -m conntrack --ctstate NEW -j ACCEPT
    nc -l -p 18765 -e /bin/cat &
    listener=$!
    trap 'kill "${listener}" 2>/dev/null || true' EXIT
    sleep 1
    reply=$(printf 'private-loopback\n' | nc -w 2 127.0.0.1 18765)
    test "${reply}" = private-loopback
    if nc -w 2 10.101.63.36 8191 </dev/null >/dev/null 2>&1; then
        echo 'FAIL: new external connection permitted' >&2
        exit 1
    fi
    # Require a DROP policy and actual packet hits, not merely a failed probe.
    iptables -w 5 -L OUTPUT -n -v | grep -E 'policy DROP [1-9][0-9]* packets'
    ip6tables -w 5 -S OUTPUT | grep -Fx -- '-P OUTPUT DROP'
    echo 'PASS: loopback allowed; controlled new external TCP blocked; IPv4/IPv6 default DROP'
  - |
    start.sh=#!/bin/bash
    set -e
    cd /app/data
    test -s mealie.db
    test -s .secret
    test -s .session_secret
    printf '%s\n' '83aaf967bd2d6598f65f67b1bf09d38f295c40a10c2ee49ad6e818cee17d4ad5  mealie.db' | sha256sum -c -
    # Native ASGI server only: do not run Mealie's init_db or scheduler lifespan.
    # Saved schema is already the pinned 3.29.0 head 1e69ea7cd45e.
    exec /opt/mealie/bin/uvicorn mealie.app:app --host 0.0.0.0 --port 9000 --workers 1 --lifespan off --no-proxy-headers
  options:
    disableNameSuffixHash: true
    annotations:
      kustomize.toolkit.fluxcd.io/substitute: disabled
patches:
- patch: |
    - op: remove
      path: /metadata/labels
    - op: replace
      path: /spec/ports/0/port
      value: 80
    - op: replace
      path: /spec/ports/0/targetPort
      value: 9000
    - op: remove
      path: /spec/selector/app.kubernetes.io~1name
    - op: add
      path: /spec/selector/app
      value: mealie-private
  target:
    group: ''
    version: v1
    kind: Service
    name: mealie
    namespace: default
- patch: |
    - op: remove
      path: /metadata/labels
    - op: replace
      path: /metadata/name
      value: mealie-private
    - op: replace
      path: /spec/revisionHistoryLimit
      value: 10
    - op: remove
      path: /spec/selector/matchLabels/app.kubernetes.io~1name
    - op: add
      path: /spec/selector/matchLabels/app
      value: mealie-private
    - op: remove
      path: /spec/template/metadata/labels/app.kubernetes.io~1name
    - op: add
      path: /spec/template/metadata/labels/app
      value: mealie-private
    - op: add
      path: /spec/template/metadata/annotations
      value:
        recovery.dumbhome.uk/public-owner-access: '2026-10-30T03:06:57.485Z'
    - op: remove
      path: /spec/template/spec/containers/0/env
    - op: replace
      path: /spec/template/spec/containers/0/image
      value: ghcr.io/mealie-recipes/mealie@sha256:243e33ea66e71b2094cb1f9c9167af24452405a33fc899a1dc7359dc210506f8
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: IfNotPresent
    - op: remove
      path: /spec/template/spec/containers/0/livenessProbe
    - op: replace
      path: /spec/template/spec/containers/0/name
      value: mealie
    - op: remove
      path: /spec/template/spec/containers/0/ports
    - op: remove
      path: /spec/template/spec/containers/0/resources/limits
    - op: remove
      path: /spec/template/spec/containers/0/resources/requests
    - op: replace
      path: /spec/template/spec/containers/0/volumeMounts/0/mountPath
      value: /guard
    - op: replace
      path: /spec/template/spec/containers/0/volumeMounts/0/name
      value: guard
    - op: replace
      path: /spec/template/spec/containers/0/volumeMounts/1/name
      value: working
    - op: remove
      path: /spec/template/spec/containers/0/volumeMounts/1/subPath
    - op: add
      path: /spec/template/spec/containers/0/command
      value:
      - /bin/bash
      - /guard/start.sh
    - op: add
      path: /spec/template/spec/containers/0/envFrom
      value:
      - secretRef:
          name: mealie-recovery-env
    - op: add
      path: /spec/template/spec/containers/0/readinessProbe
      value:
        exec:
          command:
          - /bin/sh
          - -c
          - curl --max-time 3 -fsS http://127.0.0.1:9000/api/app/about >/dev/null
        periodSeconds: 5
        timeoutSeconds: 4
    - op: add
      path: /spec/template/spec/containers/0/securityContext
      value:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        runAsGroup: 1000
        runAsUser: 1000
    - op: replace
      path: /spec/template/spec/volumes
      value:
      - configMap:
          name: mealie-private-guard
        name: guard
      - hostPath:
          path: /media/yasr/recovery/mealie-20261030/working/mealie
          type: Directory
        name: working
    - op: add
      path: /spec/template/spec/automountServiceAccountToken
      value: false
    - op: add
      path: /spec/template/spec/initContainers
      value:
      - command:
        - /bin/sh
        - /guard/guard.sh
        image: ghcr.io/flannel-io/flannel@sha256:9aeaf1689ad3554e686d5f4062f33a2ba173398fd8f6d0346bd1dc1a27fb1437
        imagePullPolicy: IfNotPresent
        name: network-guard
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_ADMIN
            drop:
            - ALL
          runAsUser: 0
        volumeMounts:
        - mountPath: /guard
          name: guard
          readOnly: true
    - op: add
      path: /spec/template/spec/nodeSelector
      value:
        kubernetes.io/hostname: k8s-control-plane
    - op: add
      path: /spec/strategy
      value:
        type: Recreate
  target:
    group: apps
    version: v1
    kind: Deployment
    name: mealie
    namespace: default
- patch: |
    - op: remove
      path: /metadata/annotations/forecastle.stakater.com~1appName
    - op: remove
      path: /metadata/annotations/forecastle.stakater.com~1expose
    - op: remove
      path: /metadata/annotations/forecastle.stakater.com~1group
    - op: remove
      path: /metadata/annotations/forecastle.stakater.com~1icon
    - op: add
      path: /metadata/annotations/nginx.ingress.kubernetes.io~1ssl-redirect
      value: 'true'
    - op: remove
      path: /metadata/labels
    - op: replace
      path: /spec/rules/0/host
      value: recipes.dumbhome.uk
    - op: remove
      path: /spec/rules/0/http/paths/0/backend/service/port/name
    - op: add
      path: /spec/rules/0/http/paths/0/backend/service/port/number
      value: 80
    - op: replace
      path: /spec/rules/0/http/paths/0/pathType
      value: Prefix
    - op: replace
      path: /spec/tls/0/hosts/0
      value: recipes.dumbhome.uk
  target:
    group: networking.k8s.io
    version: v1
    kind: Ingress
    name: mealie
    namespace: default
- target:
    group: apps
    version: v1
    kind: Deployment
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: not-used
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
- target:
    group: ''
    version: v1
    kind: ConfigMap
  patch: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: not-used
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
