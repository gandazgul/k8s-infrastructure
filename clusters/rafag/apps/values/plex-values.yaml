persistence:
  data:
    enabled: true
    type: pvc
    existingClaim: vault-volume
    subPath:
    - path: public
      mountPath: /data
    - path: rafag/photos/kalidroid/Camera
      mountPath: /pictures
  films:
    enabled: true
    type: pvc
    existingClaim: main-volume
    subPath:
    - path: public/films
      mountPath: /data/films
      readOnly: true
