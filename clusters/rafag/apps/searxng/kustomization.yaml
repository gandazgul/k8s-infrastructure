# Existing shared app flow with Rafag-specific patches and startup safeguards.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../../apps/generic/overlays/searxng
configMapGenerator:
- name: searxng-recovery-guard-7mhg7cb8kk
  namespace: default
  literals:
  - |
    guard.sh=#!/bin/bash
    set -eu
    state=${1:-/etc/searxng}
    device=${2:-/yasr-device/b52443c5-0f4b-43a3-a689-b444ea6c3683}
    [ -L "$device" ]
    disk=$(readlink "$device")
    name=${disk##*/}
    major_minor=$(cat /sys/class/block/"$name"/dev)
    major=${major_minor%:*}; minor=${major_minor#*:}
    [ "$(stat -c %d "$state")" = "$((major*256+minor))" ]
    [ -s "$state/settings.yml" ]
    /usr/local/searxng/.venv/bin/python -c 'import sys,yaml; s=yaml.safe_load(open(sys.argv[1])); k=s.get("server",{}).get("secret_key"); assert k and k != "ultrasecretkey"' "$state/settings.yml"
  options:
    disableNameSuffixHash: true
    annotations:
      kustomize.toolkit.fluxcd.io/substitute: disabled
patches:
- patch: |
    - op: replace
      path: /spec/template/spec/containers/0/env
      value:
      - name: GRANIAN_HOST
        value: '::'
      - name: PYTHONDONTWRITEBYTECODE
        value: '1'
      - name: SEARXNG_BASE_URL
        value: https://search.dumbhome.uk/
      - name: SEARXNG_PORT
        value: '8080'
    - op: replace
      path: /spec/template/spec/containers/0/image
      value: searxng/searxng@sha256:aa7270053bc3bf92155e2af83e2b0a7c3833c209cdeb8d396861a00c55ee7110
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: IfNotPresent
    - op: remove
      path: /spec/template/spec/containers/0/livenessProbe/httpGet
    - op: replace
      path: /spec/template/spec/containers/0/livenessProbe/initialDelaySeconds
      value: 10
    - op: add
      path: /spec/template/spec/containers/0/livenessProbe/exec
      value:
        command:
        - /usr/local/searxng/.venv/bin/python
        - -c
        - import urllib.request; assert urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=5).status
          == 200
    - op: add
      path: /spec/template/spec/containers/0/livenessProbe/periodSeconds
      value: 30
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: '1'
    - op: replace
      path: /spec/template/spec/containers/0/volumeMounts
      value:
      - mountPath: /etc/searxng
        name: yasr-volume
        readOnly: true
        subPath: recovery/searxng-20261028/working
      - mountPath: /var/cache/searxng
        name: cache
        subPath: recovery/searxng-20261028/cache
      - mountPath: /tmp
        name: tmp
    - op: add
      path: /spec/template/spec/containers/0/command
      value:
      - /usr/local/searxng/.venv/bin/granian
      - searx.webapp:app
    - op: add
      path: /spec/template/spec/containers/0/readinessProbe
      value:
        exec:
          command:
          - /usr/local/searxng/.venv/bin/python
          - -c
          - import urllib.request; assert urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=5).status
            == 200
        initialDelaySeconds: 10
        periodSeconds: 30
        timeoutSeconds: 10
    - op: add
      path: /spec/template/spec/containers/0/securityContext
      value:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        readOnlyRootFilesystem: true
        runAsUser: 0
    - op: replace
      path: /spec/template/spec/volumes
      value:
      - hostPath:
          path: /dev/disk/by-uuid
          type: Directory
        name: yasr-device
      - configMap:
          defaultMode: 365
          name: searxng-recovery-guard-7mhg7cb8kk
        name: guard
      - name: cache
        persistentVolumeClaim:
          claimName: yasr-volume
      - emptyDir: {}
        name: tmp
      - name: yasr-volume
        persistentVolumeClaim:
          claimName: yasr-volume
    - op: add
      path: /spec/template/spec/initContainers
      value:
      - command:
        - /bin/sh
        - /guard/guard.sh
        image: searxng/searxng@sha256:aa7270053bc3bf92155e2af83e2b0a7c3833c209cdeb8d396861a00c55ee7110
        imagePullPolicy: IfNotPresent
        name: verify-saved-config
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsUser: 0
        volumeMounts:
        - mountPath: /etc/searxng
          name: yasr-volume
          readOnly: true
          subPath: recovery/searxng-20261028/working
        - mountPath: /yasr-device
          name: yasr-device
          readOnly: true
        - mountPath: /guard
          name: guard
          readOnly: true
    - op: add
      path: /spec/strategy
      value:
        type: Recreate
  target:
    group: apps
    version: v1
    kind: Deployment
    name: searxng
    namespace: default
- patch: |
    - op: replace
      path: /spec/rules/0/host
      value: search.dumbhome.uk
    - op: replace
      path: /spec/tls/0/hosts/0
      value: search.dumbhome.uk
  target:
    group: networking.k8s.io
    version: v1
    kind: Ingress
    name: searxng
    namespace: default
- target:
    group: apps
    version: v1
    kind: Deployment
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: not-used
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
- target:
    group: ''
    version: v1
    kind: ConfigMap
  patch: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: not-used
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
