apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: home-assistant-editor
  namespace: default
  annotations:
    forecastle.stakater.com/appName: Config Editor
    forecastle.stakater.com/expose: 'true'
    forecastle.stakater.com/group: Management
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`configs.dumbhome.uk`)
    services:
    - name: home-assistant-editor
      port: 8080
  tls:
    secretName: internal-ingress-cert
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: home-assistant-editor-https
  namespace: default
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: home-assistant-editor-http
  namespace: default
spec:
  entryPoints:
  - web
  routes:
  - kind: Rule
    match: Host(`configs.dumbhome.uk`)
    middlewares:
    - name: home-assistant-editor-https
    services:
    - name: home-assistant-editor
      port: 8080
