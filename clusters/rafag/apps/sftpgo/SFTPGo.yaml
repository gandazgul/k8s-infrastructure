# Existing native SFTPGo recovery resources; its original HelmRelease stays suspended.
apiVersion: v1
data:
  sftpgo.json: '{"data_provider":{"driver":"sqlite","name":"/config/db.sqlite","prefer_database_credentials":true},"ftpd":{"bindings":[{"port":0}]},"sftpd":{"bindings":[{"port":0}]}}'
kind: ConfigMap
metadata:
  annotations:
    meta.helm.sh/release-name: sftpgo
    meta.helm.sh/release-namespace: default
    kustomize.toolkit.fluxcd.io/substitute: disabled
  labels:
    app.kubernetes.io/instance: sftpgo
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: sftpgo
    app.kubernetes.io/version: 2.2.2
    helm.sh/chart: sftpgo-0.12.0
    helm.toolkit.fluxcd.io/name: sftpgo
    helm.toolkit.fluxcd.io/namespace: default
  name: sftpgo
  namespace: default
---
apiVersion: v1
data:
  guard.sh: |
    #!/bin/bash
    set -eu
    state=${1:-/config}
    device=${2:-/yasr-device/b52443c5-0f4b-43a3-a689-b444ea6c3683}
    sys=${3:-/sys/class/block}
    config=${4:-/etc/sftpgo/sftpgo.json}
    [ -d "${state}" ]
    [ ! -L "${state}" ]
    [ -L "${device}" ]
    disk=$(readlink "${device}"); name=${disk##*/}
    major_minor=$(cat "${sys}/${name}/dev")
    major=${major_minor%:*}; minor=${major_minor#*:}
    [ "$(stat -c %d "${state}")" = "$((major*256+minor))" ]
    [ -f "${state}/db.sqlite" ]
    [ ! -L "${state}/db.sqlite" ]
    [ -s "${state}/db.sqlite" ]
    [ -r "${state}/db.sqlite" ]
    [ -w "${state}" ]
    [ -s "${config}" ]
    # Refuse altered base config. Approved SFTP is an explicit env override.
    [ "$(sha256sum "${config}" | cut -d ' ' -f 1)" = '81a53e9fcf2253f4d9b7c0eeae763a1c6f0985db006d424431be2b873493b407' ]
    if [ "${state}" = /config ]; then
        [ "$(id -u)" = 1000 ]
        [ -f /hostkeys/ssh_host_ed25519_key ]
        [ ! -L /hostkeys/ssh_host_ed25519_key ]
        [ "$(stat -c %a /hostkeys/ssh_host_ed25519_key)" = 600 ]
        [ "$(stat -c %u /hostkeys/ssh_host_ed25519_key)" = 1000 ]
        awk '$5=="/hostkeys" && $6 ~ /(^|,)ro(,|$)/ {ok=1} END {exit !ok}' /proc/self/mountinfo
        main_device=$(readlink /yasr-device/e1e00f55-7a88-4deb-a093-9ff8ce800c03)
        main_name=${main_device##*/}
        main_mm=$(cat "/sys/class/block/${main_name}/dev")
        main_major=${main_mm%:*}; main_minor=${main_mm#*:}
        for path in /data/rafag /data/angela /media/main/public /data/public; do
            [ -d "${path}" ]
            [ "$(stat -c %d "${path}")" = "$((main_major*256+main_minor))" ]
            awk -v p="${path}" '$5==p && $6 ~ /(^|,)rw(,|$)/ {ok=1} END {exit !ok}' /proc/self/mountinfo
        done
        [ "$(stat -c %d /source-config)" = "$((major*256+minor))" ]
        awk '$5=="/source-config" && $6 ~ /(^|,)ro(,|$)/ {ok=1} END {exit !ok}' /proc/self/mountinfo
    fi
  network-guard.sh: |
    #!/bin/bash
    set -eux
    # This script runs only in the Pod network namespace, never in hostNetwork.
    # The positive control must succeed before a failed connection proves a block.
    nc -w 2 10.101.63.36 8191 </dev/null >/dev/null
    for tool in iptables ip6tables; do
        "${tool}" -w 5 -P OUTPUT DROP
        "${tool}" -w 5 -P INPUT DROP
        "${tool}" -w 5 -P FORWARD DROP
        "${tool}" -w 5 -F
        "${tool}" -w 5 -A OUTPUT -o lo -j ACCEPT
        "${tool}" -w 5 -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
        "${tool}" -w 5 -A INPUT -i lo -j ACCEPT
        "${tool}" -w 5 -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
    done
    # Approved normal HTTP/WebDAV: actual Traefik Pod only.
    # OUTPUT still rejects all NEW connections; replies use conntrack above.
    iptables -w 5 -A INPUT -s 10.244.0.4/32 -p tcp --dport 8080 -j ACCEPT
    iptables -w 5 -A INPUT -s 10.244.0.4/32 -p tcp --dport 8081 -j ACCEPT
    # LAN SFTP only. NodePort uses Local traffic policy to preserve source.
    iptables -w 5 -A INPUT -s 10.1.1.0/24 -p tcp --dport 2022 -j ACCEPT
    # Readiness and liveness are exec probes on loopback10000, not node TCP probes.
    nc -l -p 18765 -e /bin/cat &
    listener=$!
    trap 'kill "${listener}" 2>/dev/null || true' EXIT
    sleep 1
    reply=$(printf 'private-loopback\n' | nc -w 2 127.0.0.1 18765)
    test "${reply}" = private-loopback
    if nc -w 2 10.101.63.36 8191 </dev/null >/dev/null 2>&1; then
        echo 'FAIL: new external connection permitted' >&2
        exit 1
    fi
    # Require a DROP policy and actual packet hits, not merely a failed probe.
    iptables -w 5 -L OUTPUT -n -v | grep -E 'policy DROP [1-9][0-9]* packets'
    ip6tables -w 5 -S OUTPUT | grep -Fx -- '-P OUTPUT DROP'
    echo 'PASS: loopback allowed; controlled new external TCP blocked; IPv4/IPv6 default DROP'
kind: ConfigMap
metadata:
  name: sftpgo-execution-guard
  namespace: default
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    recovery.dumbhome.uk/state: normal-http-webdav-lan-sftp-new-identity
  name: sftpgo
  namespace: default
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: sftpgo
      app.kubernetes.io/name: sftpgo
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: sftpgo
        app.kubernetes.io/name: sftpgo
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - /bin/bash
        - -ec
        - /bin/bash /guard/guard.sh; exec /usr/local/bin/sftpgo serve --config-dir /etc/sftpgo
        env:
        - name: TZ
          value: America/New_York
        - name: SFTPGO_SFTPD__BINDINGS__0__ADDRESS
          value: 0.0.0.0
        - name: SFTPGO_SFTPD__BINDINGS__0__PORT
          value: '2022'
        - name: SFTPGO_SFTPD__HOST_KEYS
          value: /hostkeys/ssh_host_ed25519_key
        - name: SFTPGO_HTTPD__BINDINGS__0__ADDRESS
          value: 0.0.0.0
        - name: SFTPGO_HTTPD__BINDINGS__0__PORT
          value: '8080'
        - name: SFTPGO_WEBDAVD__BINDINGS__0__ADDRESS
          value: 0.0.0.0
        - name: SFTPGO_WEBDAVD__BINDINGS__0__PORT
          value: '8081'
        - name: SFTPGO_TELEMETRY__BIND_ADDRESS
          value: 127.0.0.1
        - name: SFTPGO_TELEMETRY__BIND_PORT
          value: '10000'
        image: ghcr.io/drakkan/sftpgo@sha256:3016b086b12e541bfcce037f79ab4f303901e1dc653c381b217f83fea3f80603
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - /bin/bash
            - -ec
            - exec 3<>/dev/tcp/127.0.0.1/10000; printf "GET /healthz HTTP/1.0\r\n\r\n" >&3; read -r line <&3; [[ "$line" ==
              *" 200 "* ]]
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: sftpgo
        ports:
        - containerPort: 2022
          name: sftp
          protocol: TCP
        - containerPort: 8081
          name: webdav
          protocol: TCP
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 10000
          name: telemetry
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - /bin/bash
            - -ec
            - exec 3<>/dev/tcp/127.0.0.1/10000; printf "GET /healthz HTTP/1.0\r\n\r\n" >&3; read -r line <&3; [[ "$line" ==
              *" 200 "* ]]
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 1000
          runAsUser: 1000
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/sftpgo
          name: config
          readOnly: true
        - mountPath: /hostkeys
          name: yasr-volume
          readOnly: true
          subPath: configs/sftpgo-hostkeys
        - mountPath: /config
          name: yasr-volume
          subPath: recovery/sftpgo-20261029/working
        - mountPath: /source-config
          name: yasr-volume
          readOnly: true
          subPath: configs/sftpgo
        - mountPath: /yasr-device
          name: yasr-device
          readOnly: true
        - mountPath: /guard
          name: guard
          readOnly: true
        - mountPath: /data/rafag
          name: main-volume
          subPath: rafag
        - mountPath: /data/angela
          name: main-volume
          subPath: angela
        - mountPath: /media/main/public
          name: main-volume
          subPath: public
        - mountPath: /data/public
          name: main-volume
          subPath: public
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - /bin/sh
        - /guard/network-guard.sh
        image: ghcr.io/flannel-io/flannel@sha256:9aeaf1689ad3554e686d5f4062f33a2ba173398fd8f6d0346bd1dc1a27fb1437
        imagePullPolicy: IfNotPresent
        name: network-guard
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_ADMIN
            drop:
            - ALL
          runAsUser: 0
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /guard
          name: guard
          readOnly: true
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: sftpgo
      serviceAccountName: sftpgo
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: sftpgo
        name: config
      - name: main-volume
        persistentVolumeClaim:
          claimName: main-volume
      - name: yasr-volume
        persistentVolumeClaim:
          claimName: yasr-volume
      - hostPath:
          path: /dev/disk/by-uuid
          type: Directory
        name: yasr-device
      - configMap:
          defaultMode: 365
          name: sftpgo-execution-guard
        name: guard
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    meta.helm.sh/release-name: sftpgo
    meta.helm.sh/release-namespace: default
  labels:
    app.kubernetes.io/instance: sftpgo
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: sftpgo
    app.kubernetes.io/version: 2.2.2
    helm.sh/chart: sftpgo-0.12.0
    helm.toolkit.fluxcd.io/name: sftpgo
    helm.toolkit.fluxcd.io/namespace: default
  name: sftpgo
  namespace: default
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - appProtocol: http
    name: http
    port: 80
    protocol: TCP
    targetPort: http
  - appProtocol: webdav
    name: webdav
    port: 81
    protocol: TCP
    targetPort: webdav
  - appProtocol: http
    name: telemetry
    port: 10000
    protocol: TCP
    targetPort: telemetry
  selector:
    app.kubernetes.io/instance: sftpgo
    app.kubernetes.io/name: sftpgo
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: sftpgo-lan-sftp
  namespace: default
spec:
  externalTrafficPolicy: Local
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: sftp
    nodePort: 30222
    port: 2022
    protocol: TCP
    targetPort: sftp
  selector:
    app.kubernetes.io/instance: sftpgo
    app.kubernetes.io/name: sftpgo
  sessionAffinity: None
  type: NodePort
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sftpgo-owner-http-held
  namespace: default
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`sftpgo.dumbhome.uk`)
    services:
    - name: sftpgo
      port: http
  tls:
    secretName: internal-ingress-cert
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sftpgo-owner-http-redirect
  namespace: default
spec:
  entryPoints:
  - web
  routes:
  - kind: Rule
    match: Host(`sftpgo.dumbhome.uk`) || Host(`webdav.dumbhome.uk`)
    middlewares:
    - name: sftpgo-https
    services:
    - name: sftpgo
      port: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sftpgo-https
  namespace: default
spec:
  redirectScheme:
    permanent: true
    scheme: https
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sftpgo-webdav
  namespace: default
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`webdav.dumbhome.uk`)
    services:
    - name: sftpgo
      port: webdav
  tls:
    secretName: internal-ingress-cert
