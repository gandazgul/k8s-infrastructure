---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: immich
  name: immich-valkey
  namespace: default
spec:
  ports:
  - name: valkey
    port: 6379
    targetPort: 6379
  selector:
    app.kubernetes.io/component: valkey
    app.kubernetes.io/name: immich
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: immich
  name: immich-valkey
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: valkey
      app.kubernetes.io/name: immich
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: valkey
        app.kubernetes.io/name: immich
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - valkey-server
        - --bind
        - 0.0.0.0
        - --protected-mode
        - 'no'
        - --appendonly
        - 'yes'
        - --appendfsync
        - everysec
        - --save
        - ''
        image: docker.io/valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - valkey-cli
            - -h
            - 127.0.0.1
            - ping
          failureThreshold: 6
          periodSeconds: 5
          timeoutSeconds: 2
        name: container
        ports:
        - containerPort: 6379
          name: valkey
        readinessProbe:
          exec:
            command:
            - valkey-cli
            - -h
            - 127.0.0.1
            - ping
          failureThreshold: 3
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          limits:
            cpu: '1'
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 0
          runAsUser: 0
        startupProbe:
          exec:
            command:
            - valkey-cli
            - -h
            - 127.0.0.1
            - ping
          failureThreshold: 60
          periodSeconds: 5
          timeoutSeconds: 2
        volumeMounts:
        - mountPath: /data
          name: yasr-volume
          subPath: configs/immich/valkey
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: k8s-control-plane
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: yasr-volume
        persistentVolumeClaim:
          claimName: yasr-volume
