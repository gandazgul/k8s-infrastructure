---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: immich
  name: immich-machine-learning
  namespace: default
spec:
  ports:
  - name: http
    port: 3003
    targetPort: 3003
  selector:
    app.kubernetes.io/component: machine-learning
    app.kubernetes.io/name: immich
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: immich
  name: immich-machine-learning
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: machine-learning
      app.kubernetes.io/name: immich
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: machine-learning
        app.kubernetes.io/name: immich
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: IMMICH_PORT
          value: '3003'
        image: ghcr.io/immich-app/immich-machine-learning:v3.3.3@sha256:0c0905ace426c490471e206707eb027c3ed46a5bd1fbf7e48f7c3536ec7384d0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - python3
            - healthcheck.py
          failureThreshold: 6
          periodSeconds: 10
          timeoutSeconds: 5
        name: container
        ports:
        - containerPort: 3003
          name: http
        readinessProbe:
          exec:
            command:
            - python3
            - healthcheck.py
          failureThreshold: 3
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: '4'
            memory: 8Gi
          requests:
            cpu: 500m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 0
          runAsUser: 0
        startupProbe:
          exec:
            command:
            - python3
            - healthcheck.py
          failureThreshold: 60
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /cache
          name: yasr-volume
          subPath: configs/immich/model-cache
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: k8s-control-plane
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: yasr-volume
        persistentVolumeClaim:
          claimName: yasr-volume
