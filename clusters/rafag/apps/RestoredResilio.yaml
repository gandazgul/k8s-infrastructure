apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: restored-resilio
  namespace: default
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  suspend: false
  path: ./clusters/rafag/apps/restored-resilio/
  prune: false
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: k8s-infrastructure
    namespace: kube-system
  healthChecks:
  - apiVersion: apps/v1
    kind: Deployment
    name: resilio-resilio-sync
    namespace: default
