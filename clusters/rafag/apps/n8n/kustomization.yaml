# Existing shared app flow with Rafag-specific patches and startup safeguards.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../../apps/generic/overlays/n8n
- Ingress.yaml
configMapGenerator:
- name: n8n-private-guard
  namespace: default
  literals:
  - |
    network-guard.sh=#!/bin/bash
    set -eu
    # Pod namespace only. No host firewall change. Saved HTTPS APIs and dynamic RSS.
    for tool in iptables ip6tables; do
        "${tool}" -w 5 -P OUTPUT DROP
        "${tool}" -w 5 -P INPUT DROP
        "${tool}" -w 5 -P FORWARD DROP
        "${tool}" -w 5 -F
        "${tool}" -w 5 -A OUTPUT -o lo -j ACCEPT
        "${tool}" -w 5 -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
        "${tool}" -w 5 -A INPUT -i lo -j ACCEPT
        "${tool}" -w 5 -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
        "${tool}" -w 5 -A OUTPUT -p tcp --dport 443 -j ACCEPT
    done
    # Saved native SFTP credential target; no general SSH/LAN permission.
    # The export workflow stays held until its saved storage is verified.
    iptables -w 5 -A OUTPUT -d 10.1.1.10/32 -p tcp --dport 22 -j ACCEPT
    # Verified kube-dns ClusterIP.
    for protocol in udp tcp; do
        iptables -w 5 -A OUTPUT -d 10.96.0.10/32 -p "${protocol}" --dport 53 -j ACCEPT
    done
    iptables -w 5 -A INPUT -s 10.244.0.1/32 -p tcp --dport 5678 -j ACCEPT
    iptables -w 5 -A INPUT -s 10.244.0.4/32 -p tcp --dport 5678 -j ACCEPT
  - |
    start.cjs=const fs = require('node:fs');
    const { spawnSync } = require('node:child_process');
    const UUID = 'b52443c5-0f4b-43a3-a689-b444ea6c3683';
    function guard({ mounted, key, savedKey, size, approved, active, published }) {
        if (!mounted || size <= 0) throw Error('Storage identity refused');
        if (!key || !savedKey || key !== savedKey) throw Error('Existing encryption key identity refused');
        if (active.some(id => !approved.includes(id)) || published.some(id => !approved.includes(id))) throw Error('Unapproved activation refused');
        if (JSON.stringify([...active].sort()) !== JSON.stringify([...published].sort())) throw Error('Publication mismatch refused');
    }
    module.exports = { guard };
    if (require.main === module) {
        const { DatabaseSync } = require('node:sqlite');
        const root = '/home/node/.n8n';
        const device = fs.readlinkSync(`/host-uuid/${UUID}`).split('/').pop();
        const mounted = fs.readFileSync('/host-mountinfo', 'utf8').split('\n').some(line =>
            line.includes(' /media/yasr rw,') && line.includes(` - xfs /dev/${device} rw,`));
        const db = new DatabaseSync(`${root}/database.sqlite`, { readOnly: true });
        const ids = sql => db.prepare(sql).all().map(row => row.id);
        const approved = JSON.parse(fs.readFileSync(`${root}/normal-operation.json`, 'utf8')).approved;
        guard({ mounted, key: process.env.N8N_ENCRYPTION_KEY,
            savedKey: JSON.parse(fs.readFileSync(`${root}/config`, 'utf8')).encryptionKey,
            size: fs.statSync(`${root}/database.sqlite`).size, approved,
            active: ids('SELECT id FROM workflow_entity WHERE active != 0'),
            published: ids('SELECT id FROM workflow_entity WHERE activeVersionId IS NOT NULL') });
        db.close();
        console.log('PASS original storage/key and approved activation subset; normal native runtime');
        const result = spawnSync('/usr/local/bin/n8n', ['start'], { stdio: 'inherit', env: process.env });
        process.exit(result.status ?? 1);
    }
  options:
    disableNameSuffixHash: true
    annotations:
      kustomize.toolkit.fluxcd.io/substitute: disabled
patches:
- patch: |
    - op: remove
      path: /metadata/labels
    - op: replace
      path: /metadata/name
      value: n8n-read-only
    - op: replace
      path: /spec/ports/0/targetPort
      value: 5678
    - op: remove
      path: /spec/selector/app.kubernetes.io~1name
    - op: add
      path: /spec/selector/app
      value: n8n-private
  target:
    group: ''
    version: v1
    kind: Service
    name: n8n
    namespace: default
- patch: |
    - op: remove
      path: /metadata/labels
    - op: replace
      path: /metadata/name
      value: n8n-private
    - op: replace
      path: /spec/revisionHistoryLimit
      value: 10
    - op: remove
      path: /spec/selector/matchLabels/app.kubernetes.io~1name
    - op: add
      path: /spec/selector/matchLabels/app
      value: n8n-private
    - op: remove
      path: /spec/template/metadata/labels/app.kubernetes.io~1name
    - op: add
      path: /spec/template/metadata/labels/app
      value: n8n-private
    - op: add
      path: /spec/template/metadata/annotations
      value:
        kubectl.kubernetes.io/restartedAt: '2026-10-30T19:56:45-04:00'
    - op: replace
      path: /spec/template/spec/containers/0/env
      value:
      - name: N8N_DIAGNOSTICS_ENABLED
        value: 'false'
      - name: N8N_VERSION_NOTIFICATIONS_ENABLED
        value: 'false'
      - name: N8N_TEMPLATES_ENABLED
        value: 'false'
      - name: N8N_PERSONALIZATION_ENABLED
        value: 'false'
      - name: N8N_RUNNERS_MODE
        value: internal
      - name: N8N_RUNNERS_BROKER_LISTEN_ADDRESS
        value: 127.0.0.1
      - name: N8N_HOST
        value: n8n.dumbhome.uk
      - name: N8N_PROTOCOL
        value: http
      - name: N8N_EDITOR_BASE_URL
        value: https://n8n.dumbhome.uk/
      - name: N8N_PROXY_HOPS
        value: '1'
      - name: N8N_PORT
        value: '5678'
      - name: WEBHOOK_URL
        value: https://n8n.dumbhome.uk/
      - name: GENERIC_TIMEZONE
        value: America/New_York
      - name: N8N_ENCRYPTION_KEY
        valueFrom:
          secretKeyRef:
            key: encryption-key
            name: n8n-private-existing-key
      - name: EXECUTIONS_DATA_PRUNE
        value: 'false'
    - op: replace
      path: /spec/template/spec/containers/0/image
      value: docker.io/n8nio/n8n@sha256:b4a4adb0f35d8f86eede56ebd7ae36892e25758ffc0276df14f2c69c111aac48
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: IfNotPresent
    - op: remove
      path: /spec/template/spec/containers/0/livenessProbe
    - op: replace
      path: /spec/template/spec/containers/0/name
      value: n8n
    - op: remove
      path: /spec/template/spec/containers/0/ports
    - op: replace
      path: /spec/template/spec/containers/0/readinessProbe/httpGet/path
      value: /healthz/readiness
    - op: replace
      path: /spec/template/spec/containers/0/readinessProbe/httpGet/port
      value: 5678
    - op: remove
      path: /spec/template/spec/containers/0/readinessProbe/httpGet/scheme
    - op: remove
      path: /spec/template/spec/containers/0/readinessProbe/initialDelaySeconds
    - op: replace
      path: /spec/template/spec/containers/0/readinessProbe/periodSeconds
      value: 5
    - op: replace
      path: /spec/template/spec/containers/0/readinessProbe/timeoutSeconds
      value: 3
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: '2'
    - op: replace
      path: /spec/template/spec/containers/0/volumeMounts
      value:
      - mountPath: /home/node/.n8n
        name: working
        subPath: recovery/n8n-editor-20261030-native/state
      - mountPath: /guard
        name: guard
        readOnly: true
      - mountPath: /host-uuid
        name: host-uuid
        readOnly: true
      - mountPath: /host-mountinfo
        name: host-mountinfo
        readOnly: true
    - op: add
      path: /spec/template/spec/containers/0/command
      value:
      - node
      - /guard/start.cjs
    - op: add
      path: /spec/template/spec/containers/0/securityContext
      value:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        runAsGroup: 1000
        runAsUser: 1000
    - op: replace
      path: /spec/template/spec/volumes
      value:
      - name: working
        persistentVolumeClaim:
          claimName: yasr-volume
      - configMap:
          name: n8n-private-guard
        name: guard
      - hostPath:
          path: /dev/disk/by-uuid
          type: Directory
        name: host-uuid
      - hostPath:
          path: /proc/1/mountinfo
          type: File
        name: host-mountinfo
    - op: add
      path: /spec/template/spec/automountServiceAccountToken
      value: false
    - op: add
      path: /spec/template/spec/initContainers
      value:
      - command:
        - /bin/sh
        - /guard/network-guard.sh
        image: ghcr.io/flannel-io/flannel@sha256:9aeaf1689ad3554e686d5f4062f33a2ba173398fd8f6d0346bd1dc1a27fb1437
        imagePullPolicy: IfNotPresent
        name: network-guard
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_ADMIN
            drop:
            - ALL
          runAsUser: 0
        volumeMounts:
        - mountPath: /guard
          name: guard
          readOnly: true
    - op: add
      path: /spec/template/spec/nodeSelector
      value:
        kubernetes.io/hostname: k8s-control-plane
    - op: add
      path: /spec/strategy
      value:
        type: Recreate
  target:
    group: apps
    version: v1
    kind: Deployment
    name: n8n
    namespace: default
- patch: |
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      annotations:
        forecastle.stakater.com/appName: n8n
        forecastle.stakater.com/expose: 'true'
        forecastle.stakater.com/group: Automation
        forecastle.stakater.com/icon: https://n8n.io/favicon.ico
      labels:
        app.kubernetes.io/name: n8n
      name: n8n
      namespace: default
    $patch: delete
  target:
    group: networking.k8s.io
    version: v1
    kind: Ingress
    name: n8n
    namespace: default
- target:
    group: apps
    version: v1
    kind: Deployment
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: not-used
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
- target:
    group: ''
    version: v1
    kind: ConfigMap
  patch: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: not-used
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
