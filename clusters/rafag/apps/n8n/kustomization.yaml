# Temporary compatibility routing only; app runtime stays in the original generic overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../../apps/generic/overlays/n8n
- Ingress.yaml
patches:
- target:
    group: networking.k8s.io
    version: v1
    kind: Ingress
    name: n8n
    namespace: default
  patch: |-
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: n8n
      namespace: default
    $patch: delete
