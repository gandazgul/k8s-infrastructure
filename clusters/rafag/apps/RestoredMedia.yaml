apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: restored-media
  namespace: default
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  suspend: false
  path: ./clusters/rafag/apps/restored-media/
  prune: false
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: k8s-infrastructure
    namespace: kube-system
  healthChecks:
  - apiVersion: apps/v1
    kind: Deployment
    name: sonarr-transmission-private
    namespace: default
