apiVersion: v1
data:
  network-guard.sh: |
    #!/bin/bash
    set -eu
    # Pod namespace only. No host firewall change. Saved HTTPS APIs and dynamic RSS.
    for tool in iptables ip6tables; do
        "${tool}" -w 5 -P OUTPUT DROP
        "${tool}" -w 5 -P INPUT DROP
        "${tool}" -w 5 -P FORWARD DROP
        "${tool}" -w 5 -F
        "${tool}" -w 5 -A OUTPUT -o lo -j ACCEPT
        "${tool}" -w 5 -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
        "${tool}" -w 5 -A INPUT -i lo -j ACCEPT
        "${tool}" -w 5 -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
        "${tool}" -w 5 -A OUTPUT -p tcp --dport 443 -j ACCEPT
    done
    # Saved native SFTP credential target; no general SSH/LAN permission.
    # The export workflow stays held until its saved storage is verified.
    iptables -w 5 -A OUTPUT -d 10.1.1.10/32 -p tcp --dport 22 -j ACCEPT
    # Verified kube-dns ClusterIP.
    for protocol in udp tcp; do
        iptables -w 5 -A OUTPUT -d 10.96.0.10/32 -p "${protocol}" --dport 53 -j ACCEPT
    done
    iptables -w 5 -A INPUT -s 10.244.0.1/32 -p tcp --dport 5678 -j ACCEPT
    iptables -w 5 -A INPUT -s 10.244.0.4/32 -p tcp --dport 5678 -j ACCEPT
  start.cjs: |
    const fs = require('node:fs');
    const { spawnSync } = require('node:child_process');
    const UUID = 'b52443c5-0f4b-43a3-a689-b444ea6c3683';
    function guard({ mounted, key, savedKey, size, approved, active, published }) {
        if (!mounted || size <= 0) throw Error('Storage identity refused');
        if (!key || !savedKey || key !== savedKey) throw Error('Existing encryption key identity refused');
        if (active.some(id => !approved.includes(id)) || published.some(id => !approved.includes(id))) throw Error('Unapproved activation refused');
        if (JSON.stringify([...active].sort()) !== JSON.stringify([...published].sort())) throw Error('Publication mismatch refused');
    }
    module.exports = { guard };
    if (require.main === module) {
        const { DatabaseSync } = require('node:sqlite');
        const root = '/home/node/.n8n';
        const device = fs.readlinkSync(`/host-uuid/${UUID}`).split('/').pop();
        const mounted = fs.readFileSync('/host-mountinfo', 'utf8').split('\n').some(line =>
            line.includes(' /media/yasr rw,') && line.includes(` - xfs /dev/${device} rw,`));
        const db = new DatabaseSync(`${root}/database.sqlite`, { readOnly: true });
        const ids = sql => db.prepare(sql).all().map(row => row.id);
        const approved = JSON.parse(fs.readFileSync(`${root}/normal-operation.json`, 'utf8')).approved;
        guard({ mounted, key: process.env.N8N_ENCRYPTION_KEY,
            savedKey: JSON.parse(fs.readFileSync(`${root}/config`, 'utf8')).encryptionKey,
            size: fs.statSync(`${root}/database.sqlite`).size, approved,
            active: ids('SELECT id FROM workflow_entity WHERE active != 0'),
            published: ids('SELECT id FROM workflow_entity WHERE activeVersionId IS NOT NULL') });
        db.close();
        console.log('PASS original storage/key and approved activation subset; normal native runtime');
        const result = spawnSync('/usr/local/bin/n8n', ['start'], { stdio: 'inherit', env: process.env });
        process.exit(result.status ?? 1);
    }
