apiVersion: v1
data:
  check.php: |
    <?php
    // Refuse a missing or empty database before PDO can create one.
    $path = '/var/www/wallabag/data/db/wallabag.sqlite';
    if (!is_file($path) || filesize($path) === 0) { exit(1); }
    $db = new PDO('sqlite:' . $path);
    $db->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
    if ($db->query('PRAGMA integrity_check')->fetchColumn() !== 'ok') { exit(1); }
    foreach (['wallabag_user'=>1, 'wallabag_entry'=>7, 'wallabag_tag'=>3, 'wallabag_config'=>1, 'migration_versions'=>46] as $table=>$count) {
        if ((int)$db->query('SELECT COUNT(*) FROM ' . $table)->fetchColumn() !== $count) { exit(1); }
    }
    // All tables, including article content, verifiers, tokens and settings.
    foreach ($db->query('SELECT name FROM sqlite_master WHERE type="table" ORDER BY name')->fetchAll(PDO::FETCH_COLUMN) as $table) {
        $rows = $db->query('SELECT * FROM "' . $table . '" ORDER BY rowid')->fetchAll(PDO::FETCH_ASSOC);
        echo $table, ' ', count($rows), ' ', hash('sha256', serialize($rows)), "\n";
    }
  guard.sh: |
    #!/bin/bash
    set -eux
    # This script runs only in the Pod network namespace, never in hostNetwork.
    # The positive control must succeed before a failed connection proves a block.
    nc -w 2 10.101.63.36 8191 </dev/null >/dev/null
    for tool in iptables ip6tables; do
        "${tool}" -w 5 -P OUTPUT DROP
        "${tool}" -w 5 -P INPUT DROP
        "${tool}" -w 5 -P FORWARD DROP
        "${tool}" -w 5 -F
        "${tool}" -w 5 -A OUTPUT -o lo -j ACCEPT
        "${tool}" -w 5 -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
        "${tool}" -w 5 -A INPUT -i lo -j ACCEPT
        "${tool}" -w 5 -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
    done
    # Approved owner-access exception: actual Traefik Pod only, native HTTP port only.
    # OUTPUT still rejects all NEW connections; replies use conntrack above.
    iptables -w 5 -A INPUT -s 10.244.0.4/32 -p tcp --dport 80 -m conntrack --ctstate NEW -j ACCEPT
    nc -l -p 18765 -e /bin/cat &
    listener=$!
    trap 'kill "${listener}" 2>/dev/null || true' EXIT
    sleep 1
    reply=$(printf 'private-loopback\n' | nc -w 2 127.0.0.1 18765)
    test "${reply}" = private-loopback
    if nc -w 2 10.101.63.36 8191 </dev/null >/dev/null 2>&1; then
        echo 'FAIL: new external connection permitted' >&2
        exit 1
    fi
    # Require a DROP policy and actual packet hits, not merely a failed probe.
    iptables -w 5 -L OUTPUT -n -v | grep -E 'policy DROP [1-9][0-9]* packets'
    ip6tables -w 5 -S OUTPUT | grep -Fx -- '-P OUTPUT DROP'
    echo 'PASS: loopback allowed; controlled new external TCP blocked; IPv4/IPv6 default DROP'
  start.sh: |
    #!/bin/sh
    set -e
    cd /var/www/wallabag
    test -s data/site-credentials-secret-key.txt
    php /guard/check.php
    # Native template rendering only. Never run install, migrations, composer or workers.
    envsubst < /etc/wallabag/parameters.template.yml > app/config/parameters.yml
    envsubst < /etc/wallabag/php-wallabag.template.ini > /etc/php81/conf.d/50_wallabag.ini
    sed -i 's/listen \[::\]:80 ipv6only=off;/listen 0.0.0.0:80;/' /etc/nginx/nginx.conf
    grep -F 'listen 0.0.0.0:80;' /etc/nginx/nginx.conf
    # These are the two native web services, with no queue consumer or scheduler.
    test "$(ls /etc/s6 | sort | tr '\n' ' ')" = 'nginx php-fpm '
    rm -rf var/cache
    exec s6-svscan /etc/s6/
