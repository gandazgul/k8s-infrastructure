apiVersion: v1
data:
  guard.sh: |
    #!/bin/bash
    set -eu
    state=${1:-/config}
    device=${2:-/yasr-device/b52443c5-0f4b-43a3-a689-b444ea6c3683}
    sys=${3:-/sys/class/block}
    config=${4:-/etc/sftpgo/sftpgo.json}
    [ -d "${state}" ]
    [ ! -L "${state}" ]
    [ -L "${device}" ]
    disk=$(readlink "${device}"); name=${disk##*/}
    major_minor=$(cat "${sys}/${name}/dev")
    major=${major_minor%:*}; minor=${major_minor#*:}
    [ "$(stat -c %d "${state}")" = "$((major*256+minor))" ]
    [ -f "${state}/db.sqlite" ]
    [ ! -L "${state}/db.sqlite" ]
    [ -s "${state}/db.sqlite" ]
    [ -r "${state}/db.sqlite" ]
    [ -w "${state}" ]
    [ -s "${config}" ]
    # Refuse altered base config. Approved SFTP is an explicit env override.
    [ "$(sha256sum "${config}" | cut -d ' ' -f 1)" = '81a53e9fcf2253f4d9b7c0eeae763a1c6f0985db006d424431be2b873493b407' ]
    if [ "${state}" = /config ]; then
        [ "$(id -u)" = 1000 ]
        [ -f /hostkeys/ssh_host_ed25519_key ]
        [ ! -L /hostkeys/ssh_host_ed25519_key ]
        [ "$(stat -c %a /hostkeys/ssh_host_ed25519_key)" = 600 ]
        [ "$(stat -c %u /hostkeys/ssh_host_ed25519_key)" = 1000 ]
        awk '$5=="/hostkeys" && $6 ~ /(^|,)ro(,|$)/ {ok=1} END {exit !ok}' /proc/self/mountinfo
        main_device=$(readlink /yasr-device/e1e00f55-7a88-4deb-a093-9ff8ce800c03)
        main_name=${main_device##*/}
        main_mm=$(cat "/sys/class/block/${main_name}/dev")
        main_major=${main_mm%:*}; main_minor=${main_mm#*:}
        for path in /data/rafag /data/angela /media/main/public /data/public; do
            [ -d "${path}" ]
            [ "$(stat -c %d "${path}")" = "$((main_major*256+main_minor))" ]
            awk -v p="${path}" '$5==p && $6 ~ /(^|,)rw(,|$)/ {ok=1} END {exit !ok}' /proc/self/mountinfo
        done
        [ "$(stat -c %d /source-config)" = "$((major*256+minor))" ]
        awk '$5=="/source-config" && $6 ~ /(^|,)ro(,|$)/ {ok=1} END {exit !ok}' /proc/self/mountinfo
    fi
  network-guard.sh: |
    #!/bin/bash
    set -eux
    # This script runs only in the Pod network namespace, never in hostNetwork.
    # The positive control must succeed before a failed connection proves a block.
    nc -w 2 10.101.63.36 8191 </dev/null >/dev/null
    for tool in iptables ip6tables; do
        "${tool}" -w 5 -P OUTPUT DROP
        "${tool}" -w 5 -P INPUT DROP
        "${tool}" -w 5 -P FORWARD DROP
        "${tool}" -w 5 -F
        "${tool}" -w 5 -A OUTPUT -o lo -j ACCEPT
        "${tool}" -w 5 -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
        "${tool}" -w 5 -A INPUT -i lo -j ACCEPT
        "${tool}" -w 5 -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
    done
    # Approved normal HTTP/WebDAV: actual Traefik Pod only.
    # OUTPUT still rejects all NEW connections; replies use conntrack above.
    iptables -w 5 -A INPUT -s 10.244.0.4/32 -p tcp --dport 8080 -j ACCEPT
    iptables -w 5 -A INPUT -s 10.244.0.4/32 -p tcp --dport 8081 -j ACCEPT
    # LAN SFTP only. NodePort uses Local traffic policy to preserve source.
    iptables -w 5 -A INPUT -s 10.1.1.0/24 -p tcp --dport 2022 -j ACCEPT
    # Readiness and liveness are exec probes on loopback10000, not node TCP probes.
    nc -l -p 18765 -e /bin/cat &
    listener=$!
    trap 'kill "${listener}" 2>/dev/null || true' EXIT
    sleep 1
    reply=$(printf 'private-loopback\n' | nc -w 2 127.0.0.1 18765)
    test "${reply}" = private-loopback
    if nc -w 2 10.101.63.36 8191 </dev/null >/dev/null 2>&1; then
        echo 'FAIL: new external connection permitted' >&2
        exit 1
    fi
    # Require a DROP policy and actual packet hits, not merely a failed probe.
    iptables -w 5 -L OUTPUT -n -v | grep -E 'policy DROP [1-9][0-9]* packets'
    ip6tables -w 5 -S OUTPUT | grep -Fx -- '-P OUTPUT DROP'
    echo 'PASS: loopback allowed; controlled new external TCP blocked; IPv4/IPv6 default DROP'
