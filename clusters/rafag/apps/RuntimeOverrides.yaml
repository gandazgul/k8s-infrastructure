        image: ghcr.io/drakkan/sftpgo@sha256:3016b086b12e541bfcce037f79ab4f303901e1dc653c381b217f83fea3f80603
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - /bin/bash
            - -ec
            - exec 3<>/dev/tcp/127.0.0.1/10000; printf "GET /healthz HTTP/1.0\r\n\r\n" >&3; read -r line <&3; [[ "$line" ==
              *" 200 "* ]]
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: sftpgo
        ports:
        - containerPort: 2022
          name: sftp
          protocol: TCP
        - containerPort: 8081
          name: webdav
          protocol: TCP
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 10000
          name: telemetry
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - /bin/bash
            - -ec
            - exec 3<>/dev/tcp/127.0.0.1/10000; printf "GET /healthz HTTP/1.0\r\n\r\n" >&3; read -r line <&3; [[ "$line" ==
              *" 200 "* ]]
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 1000
          runAsUser: 1000
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/sftpgo
          name: config
          readOnly: true
        - mountPath: /hostkeys
          name: yasr-volume
          readOnly: true
          subPath: configs/sftpgo-hostkeys
        - mountPath: /config
          name: yasr-volume
          subPath: recovery/sftpgo-20261029/working
        - mountPath: /source-config
          name: yasr-volume
          readOnly: true
          subPath: configs/sftpgo
        - mountPath: /yasr-device
          name: yasr-device
          readOnly: true
        - mountPath: /guard
          name: guard
          readOnly: true
        - mountPath: /data/rafag
          name: main-volume
          subPath: rafag
        - mountPath: /data/angela
          name: main-volume
          subPath: angela
        - mountPath: /media/main/public
          name: main-volume
          subPath: public
        - mountPath: /data/public
          name: main-volume
          subPath: public
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - /bin/sh
        - /guard/network-guard.sh
        image: ghcr.io/flannel-io/flannel@sha256:9aeaf1689ad3554e686d5f4062f33a2ba173398fd8f6d0346bd1dc1a27fb1437
        imagePullPolicy: IfNotPresent
        name: network-guard
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_ADMIN
            drop:
            - ALL
          runAsUser: 0
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /guard
          name: guard
          readOnly: true
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: sftpgo
      serviceAccountName: sftpgo
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: sftpgo
        name: config
      - name: main-volume
        persistentVolumeClaim:
          claimName: main-volume
      - name: yasr-volume
        persistentVolumeClaim:
          claimName: yasr-volume
      - hostPath:
          path: /dev/disk/by-uuid
          type: Directory
        name: yasr-device
      - configMap:
          defaultMode: 365
          name: sftpgo-execution-guard
        name: guard
