                - wget -q -O /dev/null http://127.0.0.1:9090/app
              failureThreshold: 3
              periodSeconds: 5
              successThreshold: 1
              timeoutSeconds: 3
        service:
          main:
            enabled: false
    - op: add
      path: /spec/install
      value:
        disableTakeOwnership: false
    - op: add
      path: /spec/upgrade
      value:
        disableTakeOwnership: false
    - op: add
      path: /spec/postRenderers
      value:
      - kustomize:
          patches:
          - target:
              kind: ConfigMap
              name: sharry-private-config
            patch: |
              - op: replace
                path: /metadata/name
                value: sharry-private-guard
              - op: replace
                path: /data
                value:
                  guard.sh: |
                    #!/bin/bash
                    set -eux
                    # This script runs only in the Pod network namespace, never in hostNetwork.
                    # The positive control must succeed before a failed connection proves a block.
                    nc -w 2 10.101.63.36 8191 </dev/null >/dev/null
                    for tool in iptables ip6tables; do
                        "${tool}" -w 5 -P OUTPUT DROP
                        "${tool}" -w 5 -P INPUT DROP
                        "${tool}" -w 5 -P FORWARD DROP
                        "${tool}" -w 5 -F
                        "${tool}" -w 5 -A OUTPUT -o lo -j ACCEPT
                        "${tool}" -w 5 -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
                        "${tool}" -w 5 -A INPUT -i lo -j ACCEPT
                        "${tool}" -w 5 -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
                    done
                    nc -l -p 18765 -e /bin/cat &
                    listener=$!
                    trap 'kill "${listener}" 2>/dev/null || true' EXIT
                    sleep 1
                    reply=$(printf 'private-loopback\n' | nc -w 2 127.0.0.1 18765)
                    test "${reply}" = private-loopback
                    if nc -w 2 10.101.63.36 8191 </dev/null >/dev/null 2>&1; then
                        echo 'FAIL: new external connection permitted' >&2
                        exit 1
                    fi
                    # Require a DROP policy and actual packet hits, not merely a failed probe.
                    iptables -w 5 -L OUTPUT -n -v | grep -E 'policy DROP [1-9][0-9]* packets'
                    ip6tables -w 5 -S OUTPUT | grep -Fx -- '-P OUTPUT DROP'
                    echo 'PASS: loopback allowed; controlled new external TCP blocked; IPv4/IPv6 default DROP'
                  sharry.conf: |
                    include "/opt/sharry-restserver-1.8.0/conf/sharry.conf"
                    sharry.restserver {
                      base-url = "https://share.dumbhome.uk"
                      bind.address = "127.0.0.1"
                      bind.port = 9090
                      backend {
                        signup.mode = "closed"
                        auth.fixed.enabled = false
                        auth.internal.enabled = true
                        jdbc {
                          url = "jdbc:h2:/config/sharry.db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;IFEXISTS=TRUE;ACCESS_MODE_DATA=r"
                          user = "sa"
                          password = ""
                        }
                        cleanup.enabled = false
                        mail.enabled = false
                      }
                    }
              - op: add
                path: /metadata/annotations
                value:
                  kustomize.toolkit.fluxcd.io/substitute: disabled
          - target:
              kind: Deployment
              name: sharry-private
            patch: |
              - op: remove
                path: /spec/selector/matchLabels/app.kubernetes.io~1name
              - op: remove
                path: /spec/selector/matchLabels/app.kubernetes.io~1instance
              - op: add
                path: /spec/selector/matchLabels/app
                value: sharry-private
              - op: remove
                path: /spec/template/metadata/labels/app.kubernetes.io~1name
              - op: remove
                path: /spec/template/metadata/labels/app.kubernetes.io~1instance
              - op: add
                path: /spec/template/metadata/labels/app
                value: sharry-private
              - op: remove
                path: /spec/template/spec/serviceAccountName
              - op: remove
                path: /spec/template/spec/enableServiceLinks
              - op: replace
                path: /spec/template/spec/containers/0/name
                value: sharry
              - op: replace
                path: /spec/template/spec/containers/0/image
                value: docker.io/eikek0/sharry@sha256:661ff3ef42cd4aec07bf0c57e00dc9503f807a833c72efb3b5bbff185c4ae7ef
              - op: remove
                path: /spec/template/spec/containers/0/ports
              - op: replace
                path: /spec/template/spec/containers/0/volumeMounts
                value:
                - mountPath: /config
                  name: working
                  readOnly: true
                  subPath: recovery/sharry-20261030/working
                - mountPath: /guard
                  name: guard
                  readOnly: true
              - op: remove
                path: /spec/template/spec/containers/0/readinessProbe/failureThreshold
              - op: remove
                path: /spec/template/spec/containers/0/readinessProbe/initialDelaySeconds
              - op: remove
                path: /spec/template/spec/containers/0/readinessProbe/successThreshold
              - op: add
                path: /spec/template/spec/containers/0/resources
                value: {}
              - op: replace
                path: /spec/template/spec/volumes
                value:
                - configMap:
                    defaultMode: 420
                    name: sharry-private-guard
                  name: guard
                - name: working
                  persistentVolumeClaim:
                    claimName: yasr-volume
              - op: add
                path: /spec/template/spec/automountServiceAccountToken
                value: false
    - op: remove
      path: /spec/valuesFrom
