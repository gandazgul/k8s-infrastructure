---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./secrets/
  - ../../../apps/ActualBudget.yaml
  - ../../../apps/Bitwarden.yaml
  - ../../../apps/Forecastle.yaml
  - ../../../apps/HomeAssistant.yaml
  - ../../../apps/TeslaPublicKey.yaml
  - ../../../apps/MosquitoMQTTBroker.yaml
  - ../../../apps/Paperless.yaml
  - ../../../apps/Photoprism.yaml
  - ../../../apps/ImmichRafag.yaml
  - ../../../apps/Resilio.yaml
  - ../../../apps/SFTPGo.yaml
  - ../../../apps/Sharry.yaml
  #  - ../../../apps/ZWaveJS.yaml
  - ../../../apps/Mealie.yaml
  - ../../../apps/Transmission.yaml
  - ../../../apps/Lidarr.yaml
  - ../../../apps/Overseerr.yaml
  - ../../../apps/Prowlarr.yaml
  - ../../../apps/Radarr.yaml
  - ../../../apps/Sonarr.yaml
  - ../../../apps/Tdarr.yaml
  - ../../../apps/Plex.yaml
  # - ../../../apps/Ollama.yaml
  # - ../../../apps/OpenWebUI.yaml
  # - ../../../apps/Zigbee2mqtt.yaml
  - ../../../apps/N8N.yaml
  - ../../../apps/AudioBookShelf.yaml
  - ../../../apps/Flaresolverr.yaml
  - ../../../apps/Qdrant.yaml
  - ../../../apps/SearXNG.yaml
  - ../../../apps/Wallabag.yaml
  - ../../../apps/FreshRSS.yaml
  - ../../../apps/KokoroTTS.yaml
  - ../../../apps/WyomingOpenAI.yaml
  - ../../../apps/YouTubeOperationalAPI.yaml
patches:
# Vault: all data lives on vault-volume; main-volume (old disk) only holds films.
# Apps whose shared definitions hardcode main-volume are pointed at vault-volume here.
- target:
    kind: Kustomization
    name: audiobookshelf
    namespace: default
  patch: |
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: audiobookshelf
      namespace: default
    spec:
      patches:
      - target:
          kind: Deployment
          name: audiobookshelf
          namespace: default
        patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: audiobookshelf
            namespace: default
          spec:
            template:
              spec:
                volumes:
                - name: main-volume
                  persistentVolumeClaim:
                    claimName: vault-volume
- target:
    kind: Kustomization
    name: lidarr
    namespace: default
  patch: |
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: lidarr
      namespace: default
    spec:
      patches:
      - target:
          kind: Deployment
          name: lidarr
          namespace: default
        patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: lidarr
            namespace: default
          spec:
            template:
              spec:
                volumes:
                - name: main-volume
                  persistentVolumeClaim:
                    claimName: vault-volume
- target:
    group: helm.toolkit.fluxcd.io
    version: v2
    kind: HelmRelease
    name: photoprism
    namespace: default
  patch: |
    - op: replace
      path: /spec/values/persistence/originals/existingClaim
      value: vault-volume
- target:
    group: helm.toolkit.fluxcd.io
    version: v2
    kind: HelmRelease
    name: sftpgo
    namespace: default
  patch: |
    - op: replace
      path: /spec/values/volumes/0/persistentVolumeClaim/claimName
      value: vault-volume
