---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rafag
  namespace: kube-system
spec:
  dependsOn:
  - name: sealed-secret
  - name: kube-system
  - name: main-volume
  - name: yasr-volume
  # Backup storage is physically absent. Backup workloads stay held separately;
  # their missing disk must not block unrelated applications.
  # Adopt only explicitly reviewed resources, never the full legacy app tree.
  interval: 10m0s
  retryInterval: 1m0s
  timeout: 2m0s
  path: ./clusters/rafag/
  prune: false
  deletionPolicy: Orphan
  force: false
  sourceRef:
    kind: GitRepository
    name: k8s-infrastructure
    namespace: kube-system
  postBuild:
    # constants can be specified like this:
    substitute:
      PHOTOS_PATH: rafag/photos
      PHOTOS_UID: "1000"
      PHOTOS_GID: "1000"
      BITWARDEN_SUBDOMAIN: "p"
      HASS_SUBDOMAIN: "hass"
      AUDIOBOOKSHELF_SUBDOMAIN: "listen"
      AUDIOBOOKSHELF_BOOKS_PATH: "public/books-podcast-media"
      AUDIOBOOKSHELF_MOUNT_PATH: "/data/books-podcast-media"
      CLUSTER_NAME: "rafag"
    substituteFrom:
    # substitutions can also come from a config map or secret
    #    - kind: ConfigMap
    #      name: cluster-vars
    - kind: Secret
      name: secrets

  # use ${var:=default} or ${var} in the files to place variables
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: nvidia-device-plugin
    namespace: kube-system
  - apiVersion: apps/v1
    kind: Deployment
    name: youtube-operational-api
    namespace: default
