---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rafag
  namespace: kube-system
spec:
  # Adopt the control/GPU baseline plus the reviewed native YouTube API objects.
  # Legacy app/storage/infra trees remain excluded.
  interval: 10m0s
  retryInterval: 1m0s
  timeout: 2m0s
  path: ./clusters/rafag/
  prune: false
  deletionPolicy: Orphan
  force: false
  sourceRef:
    kind: GitRepository
    name: k8s-infrastructure
    namespace: kube-system
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: nvidia-device-plugin
    namespace: kube-system
  - apiVersion: apps/v1
    kind: Deployment
    name: youtube-operational-api
    namespace: default
