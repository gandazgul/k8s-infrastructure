---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rafag
  namespace: kube-system
spec:
  # The explicit root currently adopts only the source, itself and the
  # already-running GPU plugin. Legacy app/storage/infra roots remain excluded.
  interval: 10m0s
  retryInterval: 1m0s
  timeout: 2m0s
  path: ./clusters/rafag/
  prune: false
  deletionPolicy: Orphan
  force: false
  sourceRef:
    kind: GitRepository
    name: k8s-infrastructure
    namespace: kube-system
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: nvidia-device-plugin
    namespace: kube-system
