---
# rafag-only: "franken-vault" is the old disk (host mount /media/franken-vault). It only holds
# public/films plus a backup/ folder. main-volume points at the new disk (Vault, see
# MAIN_VOLUME_PATH in the sealed secret), so shared app definitions work unchanged.
# Plex, Radarr and Tdarr read films from here. Same shared PV/PVC template as the other volumes.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: franken-vault-volume
  namespace: kube-system
spec:
  interval: 10m0s
  path: ./infrastructure/storage/hdd/
  sourceRef:
    kind: GitRepository
    name: k8s-infrastructure
    namespace: kube-system
  prune: true
  postBuild:
    substitute:
      VOLUME_NAME: franken-vault-volume
      VOLUME_CAPACITY: 18Ti
      VOLUME_STORAGE_CLASS: hdd
      VOLUME_PATH: /media/franken-vault
      NAMESPACE: default
