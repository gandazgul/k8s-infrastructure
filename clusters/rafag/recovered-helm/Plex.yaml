apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
  namespace: default
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  chart:
    spec:
      chart: plex
      interval: 5m
      sourceRef:
        kind: HelmRepository
        name: k8s-at-home
        namespace: kube-system
      version: 6.2.1
  interval: 5m
  postRenderers:
  - kustomize:
      images:
      - digest: sha256:6d778d41daae68f89115aa87a44ae14a96b23e71a2093da173b5a9aac4091336
        name: plexinc/pms-docker
      patches:
      - patch: "- op: add\n  path: /spec/externalTrafficPolicy\n  value: Local"
        target:
          kind: Service
          name: plex
  suspend: false
  valuesFrom:
  - kind: Secret
    name: plex-values
    optional: false
  - kind: Secret
    name: plex-gitops-values
    valuesKey: values.yaml
    optional: false
