apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sftpgo
  namespace: default
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  chart:
    spec:
      chart: sftpgo
      interval: 5m
      sourceRef:
        kind: HelmRepository
        name: staged-sftpgo-skm
        namespace: kube-system
      version: 0.12.0
  interval: 5m
  postRenderers:
  - kustomize:
      images:
      - digest: sha256:3016b086b12e541bfcce037f79ab4f303901e1dc653c381b217f83fea3f80603
        name: ghcr.io/drakkan/sftpgo
      patches:
      - patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: sftpgo\nspec:\n  strategy:\n\
          \    rollingUpdate: null\n    type: Recreate\n  template:\n    spec:\n      containers:\n  \
          \    - args: []\n        command:\n        - /bin/bash\n        - -ec\n        - /bin/bash /guard/guard.sh;\
          \ exec /usr/local/bin/sftpgo serve --config-dir\n          /etc/sftpgo\n        name: sftpgo\n"
        target:
          kind: Deployment
          name: sftpgo
  suspend: true
  valuesFrom:
  - kind: Secret
    name: sftpgo-gitops-values
    valuesKey: values.yaml
    optional: false
