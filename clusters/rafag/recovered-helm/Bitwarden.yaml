apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bitwarden
  namespace: default
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  chart:
    spec:
      chart: vaultwarden
      interval: 5m
      sourceRef:
        kind: HelmRepository
        name: k8s-at-home
        namespace: kube-system
      version: 5.3.2
  interval: 5m
  postRenderers:
  - kustomize:
      images:
      - digest: sha256:094b5689ed81549bd293418395c7cf495ae9d960fc2d4928cef2083ef913d912
        name: vaultwarden/server
  suspend: false
  valuesFrom:
  - kind: Secret
    name: bitwarden-gitops-values
    valuesKey: values.yaml
    optional: false
