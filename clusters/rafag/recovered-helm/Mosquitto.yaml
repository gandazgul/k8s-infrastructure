apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
  namespace: default
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  chart:
    spec:
      chart: mosquitto
      sourceRef:
        kind: HelmRepository
        name: k8s-at-home
        namespace: kube-system
      version: 4.3.2
  interval: 1h0m0s
  postRenderers:
  - kustomize:
      patches:
      - patch: "- op: replace\n  path: /data/mosquitto.conf\n  value: 'listener 1883 127.0.0.1\n\n   \
          \ allow_anonymous true\n\n    include_dir /mosquitto/configinc\n\n    '\n"
        target:
          kind: ConfigMap
          name: mosquitto-config
  suspend: false
  valuesFrom:
  - kind: Secret
    name: mosquitto-gitops-values
    valuesKey: values.yaml
    optional: false
