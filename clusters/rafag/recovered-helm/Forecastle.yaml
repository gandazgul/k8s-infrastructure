apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forecastle
  namespace: default
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  chart:
    spec:
      chart: forecastle
      sourceRef:
        kind: HelmRepository
        name: stakater-charts
        namespace: kube-system
      version: 2.1.1
  interval: 5m
  postRenderers:
  - kustomize:
      images:
      - digest: sha256:382cd9572352be83c28d44443daa6ba461fc4bdf6d8ce387ff0e5e2903c37bc6
        name: stakater/forecastle
      patches:
      - patch: "- op: replace\n  path: /rules\n  value:\n  - apiGroups:\n    - ''\n    resources:\n  \
          \  - namespaces\n    verbs:\n    - get\n    - list\n  - apiGroups:\n    - networking.k8s.io\n\
          \    resources:\n    - ingresses\n    verbs:\n    - get\n    - list\n"
        target:
          kind: ClusterRole
          name: forecastle-cluster-ingress-role
  valuesFrom:
  - kind: Secret
    name: forecastle-gitops-values
    valuesKey: values.yaml
    optional: false
