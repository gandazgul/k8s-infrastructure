apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-certificates
  namespace: kube-system
spec:
  dependsOn:
  - name: cluster-infrastructure
  interval: 10m0s
  retryInterval: 1m0s
  timeout: 5m0s
  path: ./clusters/rafag/ingress-tls/
  sourceRef:
    kind: GitRepository
    name: k8s-infrastructure
    namespace: kube-system
  prune: false
  deletionPolicy: Orphan
  force: false
  healthChecks:
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    name: internal-ingress-cert
    namespace: kube-system
