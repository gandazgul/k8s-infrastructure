---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: staged-cert-manager
  namespace: kube-system
spec:
  interval: 1h
  provider: generic
  suspend: false
  type: oci
  url: oci://quay.io/jetstack/charts
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: staged-cnpg
  namespace: kube-system
spec:
  interval: 1h
  provider: generic
  suspend: false
  url: https://cloudnative-pg.github.io/charts
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: staged-emberstack
  namespace: kube-system
spec:
  interval: 1h
  provider: generic
  suspend: false
  url: https://emberstack.github.io/helm-charts
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: staged-sealed-secrets-controller
  namespace: kube-system
spec:
  interval: 1h
  provider: generic
  suspend: false
  url: https://bitnami.github.io/sealed-secrets
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: staged-traefik
  namespace: kube-system
spec:
  interval: 1h
  provider: generic
  suspend: false
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: kube-system
spec:
  chart:
    spec:
      chart: cert-manager
      sourceRef:
        kind: HelmRepository
        name: staged-cert-manager
        namespace: kube-system
      version: v1.21.3
  interval: 1h
  suspend: false
  values:
    acmesolver:
      image:
        digest: sha256:c8c1225bb2fe8ab37a330b77f0d8c2ee6a41210fcb54fc07ca606ab9a022b8b7
    cainjector:
      image:
        digest: sha256:083d0e906f8eb44e255fe4ff817ae54e49f9ed82e22f1011bb4e9e4f4b8a641f
    crds:
      enabled: true
    image:
      digest: sha256:9f4f96a33c7774cef24466fcd85031997531a03a8d117f151126baa8d1290dcc
    startupapicheck:
      image:
        digest: sha256:1c519d4afca1413d1e4ccd78bdc756184418ab55a34569a3b3de39d32f9974e1
    webhook:
      image:
        digest: sha256:055ac8e9de6a0ba6763794838fe38944acc650f68ebe1b01dd8be079e580f458
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: kube-system
spec:
  chart:
    spec:
      chart: cloudnative-pg
      sourceRef:
        kind: HelmRepository
        name: staged-cnpg
        namespace: kube-system
      version: 0.29.1
  interval: 1h
  suspend: false
  values:
    image:
      tag: 1.30.1@sha256:923c267ec29636db3bee20f993d0ec4973fa22998e1adad37da79e4d32b5bc07
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
  namespace: kube-system
spec:
  chart:
    spec:
      chart: reflector
      sourceRef:
        kind: HelmRepository
        name: staged-emberstack
        namespace: kube-system
      version: 10.0.69
  interval: 1h
  postRenderers:
  - kustomize:
      patches:
      - patch: "- op: replace\n  path: /rules/0/verbs\n  value: [get, list, watch,\
          \ create, update, patch, delete]"
        target:
          kind: ClusterRole
          name: reflector
  suspend: false
  values:
    image:
      tag: 10.0.69@sha256:b689b19ed36a5843648ad07446fc3468bd1f33327ef57eb3883519eadca4a58d
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sealed-secrets-controller
  namespace: kube-system
spec:
  chart:
    spec:
      chart: sealed-secrets
      sourceRef:
        kind: HelmRepository
        name: staged-sealed-secrets-controller
        namespace: kube-system
      version: 2.22.0
  interval: 1h
  suspend: false
  values:
    keyrenewperiod: '0'
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: kube-system
spec:
  chart:
    spec:
      chart: traefik
      sourceRef:
        kind: HelmRepository
        name: staged-traefik
        namespace: kube-system
      version: 42.1.3
  interval: 1h
  suspend: false
  values:
    ingressClass:
      enabled: true
      isDefaultClass: false
      name: nginx
    providers:
      kubernetesIngress:
        enabled: false
      kubernetesIngressNGINX:
        allowCrossNamespaceResources: false
        allowSnippetAnnotations: false
        clientBodyBufferSize: 33554432
        controllerClass: traefik.io/ingress-controller
        customHTTPErrors:
        - '404'
        - '401'
        - '403'
        - '500'
        - '503'
        defaultBackendService: kube-system/traefik-default-backend
        enabled: true
        ingressClass: nginx
        ingressClassByName: false
        proxyBodySize: 1073741824
        proxyBuffering: false
        proxyReadTimeout: 600
        proxyRequestBuffering: true
        proxySendTimeout: 600
        watchIngressWithoutClass: false
    service:
      spec:
        externalIPs:
        - 10.1.1.2
        externalTrafficPolicy: Local
        type: NodePort
    tlsStore:
      default:
        defaultCertificate:
          secretName: internal-ingress-cert
