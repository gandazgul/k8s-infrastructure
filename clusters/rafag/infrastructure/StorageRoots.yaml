---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backup-volume
  namespace: kube-system
spec:
  interval: 10m0s
  path: ./infrastructure/storage/hdd/
  sourceRef:
