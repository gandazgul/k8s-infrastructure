apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: main-volume
  namespace: kube-system
spec:
  interval: 10m0s
  path: ./clusters/rafag/storage/main-volume/
  sourceRef:
    kind: GitRepository
    name: k8s-infrastructure
    namespace: kube-system
  prune: false
  deletionPolicy: Orphan
  force: false
  healthChecks:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    name: main-volume
    namespace: default
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: yasr-volume
  namespace: kube-system
spec:
  interval: 10m0s
  path: ./clusters/rafag/storage/yasr-volume/
  sourceRef:
    kind: GitRepository
    name: k8s-infrastructure
    namespace: kube-system
  prune: false
  deletionPolicy: Orphan
  force: false
  healthChecks:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    name: yasr-volume
    namespace: default
