---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: main-volume
  namespace: kube-system
spec:
  interval: 10m0s
  path: ./clusters/rafag/storage/main-volume/
  sourceRef:
    kind: GitRepository
    name: k8s-infrastructure
    namespace: kube-system
  prune: false
  deletionPolicy: Orphan
  force: false
  healthChecks:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    name: main-volume
    namespace: default
  postBuild:
    substitute:
      VOLUME_NAME: main-volume
      VOLUME_CAPACITY: 4Ti
      VOLUME_STORAGE_CLASS: hdd
      VOLUME_PATH: /media/main
      NAMESPACE: default
      VOLUME_MODE: Filesystem
---
