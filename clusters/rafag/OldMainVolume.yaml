---
# rafag-only: the films (and the rest of the pre-migration "public" tree) stay on the
# old main disk, mounted at /mnt/old-main on the control plane. Same shared PV/PVC
# template as main-volume/backup-volume; only the volume name and path differ.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: old-main-volume
  namespace: kube-system
spec:
  interval: 10m0s
  path: ./infrastructure/storage/hdd/
  sourceRef:
    kind: GitRepository
    name: k8s-infrastructure
    namespace: kube-system
  prune: true
  postBuild:
    substitute:
      VOLUME_NAME: old-main-volume
      VOLUME_CAPACITY: 18Ti
      VOLUME_STORAGE_CLASS: hdd
      VOLUME_PATH: /mnt/old-main
      VOLUME_MODE: Filesystem
      NAMESPACE: default
