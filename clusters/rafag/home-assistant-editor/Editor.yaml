apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-editor
  namespace: default
data:
  config.yaml: |
    bind-addr: 0.0.0.0:8080
    auth: password
    cert: false
    disable-telemetry: true
    disable-update-check: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant-editor
  namespace: default
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant-editor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant-editor
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: saved-config-guard
        image: ghcr.io/home-assistant/home-assistant:2026.10.2@sha256:d30d46d24d55c43f1122ab04fdf04d2d31144815b983b07feb075f3a18814239
        command:
        - python3
        - -c
        - |
          import os, pathlib
          p = pathlib.Path('/config')
          assert p.is_dir() and not p.is_symlink(), 'saved config missing'
          assert (p / 'configuration.yaml').is_file(), 'saved YAML missing'
          assert p.stat().st_gid == os.getgid() and p.stat().st_mode & 0o020, 'saved config lacks editor group write permission'
          assert len(os.environ['PASSWORD']) >= 12, 'admin credential is missing or too short'
          d = pathlib.Path('/yasr-device/b52443c5-0f4b-43a3-a689-b444ea6c3683')
          assert d.is_symlink(), 'YASR UUID missing'
          name = pathlib.Path(os.readlink(d)).name
          major, minor = map(int, pathlib.Path('/sys/class/block', name, 'dev').read_text().split(':'))
          assert p.stat().st_dev == os.makedev(major, minor), 'wrong configuration filesystem'
          print('Saved configuration filesystem and editor prerequisites verified')
        env:
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: secrets
              key: ADMIN_PASSWORD
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /config
          subPath: configs/hass
          readOnly: true
        - name: yasr-device
          mountPath: /yasr-device
          readOnly: true
      containers:
      - name: code-server
        image: ghcr.io/coder/code-server:4.144.0@sha256:b9e8056bb74bd0c4f90284c7559eddeccd38400cfedc28e64c9d3ca50fef1f83
        # Bypass the image's ownership-changing/fixuid entrypoint.
        command:
        - /usr/bin/dumb-init
        - --
        - /usr/bin/code-server
        args:
        - --config
        - /etc/code-server/config.yaml
        - --user-data-dir
        - /config/.vscode
        - --extensions-dir
        - /config/.vscode/extensions
        - /config
        env:
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: secrets
              key: ADMIN_PASSWORD
        - name: HOME
          value: /home/coder
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "2"
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 30
        volumeMounts:
        - name: config
          mountPath: /config
          subPath: configs/hass
        - name: editor-config
          mountPath: /etc/code-server
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: home
          mountPath: /home/coder
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: yasr-volume
      - name: editor-config
        configMap:
          name: home-assistant-editor
      - name: yasr-device
        hostPath:
          path: /dev/disk/by-uuid
          type: Directory
      # Ephemeral process cache only; app/config/editor settings persist on YASR.
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      - name: home
        emptyDir:
          sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant-editor
  namespace: default
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: home-assistant-editor
  ports:
  - name: http
    port: 8080
    targetPort: http
