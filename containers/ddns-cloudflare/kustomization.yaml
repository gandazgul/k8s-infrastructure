---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  annotations:
    # JavaScript template literals must not undergo Flux env substitution.
    kustomize.toolkit.fluxcd.io/substitute: disabled
configMapGenerator:
  - name: cloudflare-ddns-code
    files:
      - app.mjs=app.js
