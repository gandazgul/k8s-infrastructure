apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-system
  namespace: kube-system
spec:
  dependsOn:
    - name: sealed-secret
  interval: 10m0s
  path: ./infrastructure/kube-system/
  # Only the explicit dispatcher allowlist is reconciled; never scan legacy files.
  prune: false
  deletionPolicy: Orphan
  force: false
  retryInterval: 1m0s
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: k8s-infrastructure
    namespace: kube-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: secrets
        optional: false
  healthChecks:
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: cluster-infrastructure
      namespace: kube-system
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: cert-manager-certificates
      namespace: kube-system
