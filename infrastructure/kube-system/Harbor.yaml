---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: harbor
  namespace: kube-system
spec:
  interval: 1h0m0s
  url: "https://helm.goharbor.io"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: kube-system
spec:
  interval: 5m
  chart:
    spec:
      chart: harbor
      version: 1.16.2
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: kube-system
      interval: 5m
  values:
    externalURL: https://harbor.${CLUSTER_DOMAIN_NAME}
    harborAdminPassword: ${ADMIN_PASSWORD}
    secretKey: ${PAPERLESS_SECRET_KEY}
    cache:
      enabled: true
      expireHours: 168
    expose:
      type: ingress
      tls:
        enabled: true
        certSource: secret
        secret:
          secretName: internal-ingress-cert
      ingress:
        hosts:
          core: harbor.${CLUSTER_DOMAIN_NAME}
        annotations:
          kubernetes.io/ingress.class: "nginx"
          forecastle.stakater.com/appName: "Harbor"
          forecastle.stakater.com/expose: "true"
          forecastle.stakater.com/url: "https://harbor.${CLUSTER_DOMAIN_NAME}"
          forecastle.stakater.com/icon: "https://goharbor.io/img/logos/harbor-horizontal-color.png"
    persistence:
      enabled: true
      persistentVolumeClaim:
        registry:
          existingClaim: yasr-volume-kube-system
          subPath: configs/harbor/registry
        database:
          existingClaim: yasr-volume-kube-system
          subPath: configs/harbor/database
        trivy:
          existingClaim: yasr-volume-kube-system
          subPath: configs/harbor/trivy
    imageChartStorage:
      type: filesystem
      filesystem:
        rootdirectory: /storage
    containerSecurityContext:
      allowPrivilegeEscalation: true
      runAsNonRoot: false
      privileged: true
      runAsUser: 1000
      runAsGroup: 472
