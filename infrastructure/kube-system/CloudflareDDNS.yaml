---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflare-ddns
  namespace: default
spec:
  interval: 1h0m0s
  # Narrow recovery root: does not adopt other kube-system infrastructure.
  path: ./infrastructure/cloudflare-ddns/
  sourceRef:
    kind: GitRepository
    name: k8s-infrastructure
    namespace: kube-system
  prune: true
  targetNamespace: default
  postBuild:
    substitute:
      CLUSTER_NAME: ${CLUSTER_NAME}
  timeout: 3m0s
  wait: true
