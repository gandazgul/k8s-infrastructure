# Controller leaf only; existing certificate leaf and certificate inventory remain in place during transfer.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: kube-system
spec:
  dependsOn:
  - name: sealed-secret
  interval: 5m
  path: ./infrastructure/cert-manager/controller/
  prune: false
  sourceRef:
    kind: GitRepository
    name: k8s-infrastructure
    namespace: kube-system
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: cert-manager
    namespace: kube-system
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: reflector
    namespace: kube-system
  postBuild:
    substituteFrom:
    - kind: Secret
      name: secrets
  deletionPolicy: Orphan
  force: false
