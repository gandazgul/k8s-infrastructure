apiVersion: batch/v1
kind: Job
metadata:
  name: cuda-sm75-gate
  namespace: local-inference-benchmark
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cuda-sm75-gate
        app.kubernetes.io/part-of: local-inference-benchmark
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 15
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: k8s-control-plane
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: cuda-check
        image: __BENCHMARK_IMAGE__
        imagePullPolicy: Never
        command:
        - /opt/local-inference/bin/cuda-sm75-check
        env:
        - name: CUDA_CACHE_DISABLE
          value: "1"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 250m
            memory: 128Mi
            ephemeral-storage: 64Mi
            nvidia.com/gpu: 1
          limits:
            cpu: "1"
            memory: 512Mi
            ephemeral-storage: 128Mi
            nvidia.com/gpu: 1
        volumeMounts:
        - name: temporary
          mountPath: /tmp
      volumes:
      - name: temporary
        emptyDir:
          sizeLimit: 64Mi
