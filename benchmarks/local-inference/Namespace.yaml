apiVersion: v1
kind: Namespace
metadata:
  name: local-inference-benchmark
  labels:
    app.kubernetes.io/part-of: local-inference-benchmark
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: benchmark-budget
  namespace: local-inference-benchmark
spec:
  hard:
    requests.nvidia.com/gpu: "1"
    requests.cpu: "2"
    limits.cpu: "4"
    requests.memory: 16Gi
    limits.memory: 32Gi
    requests.storage: 60Gi
    persistentvolumeclaims: "1"
    pods: "3"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: benchmark-container-limits
  namespace: local-inference-benchmark
spec:
  limits:
  - type: Container
    max:
      cpu: "4"
      memory: 32Gi
    default:
      cpu: "1"
      memory: 1Gi
    defaultRequest:
      cpu: 250m
      memory: 256Mi
