apiVersion: apps/v1
kind: Deployment
metadata:
  name: benchmark-runtime
  namespace: local-inference-benchmark
spec:
  replicas: 1
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: benchmark-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: benchmark-runtime
        app.kubernetes.io/part-of: local-inference-benchmark
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/hostname: k8s-control-plane
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: llama-server
        image: __BENCHMARK_IMAGE__
        imagePullPolicy: Never
        command:
        - /usr/bin/python3
        - /opt/local-inference/bin/benchmark_proxy.py
        args:
        - --api-key-file
        - /run/benchmark-auth/api-key
        - --queue-seconds
        - "30"
        - --active-seconds
        - "120"
        - --
        - /opt/local-inference/bin/llama-server
        - --host
        - 127.0.0.1
        - --port
        - "8081"
        - --model
        - /models/__MODEL_FILE__
        - --mmproj
        - /models/__PROJECTOR_FILE__
        - --alias
        - __MODEL_ALIAS__
        - --ctx-size
        - "__CONTEXT_TOKENS__"
        - --parallel
        - "1"
        - --gpu-layers
        - all
        - --fit
        - "off"
        - --threads
        - "4"
        - --threads-batch
        - "4"
        - --n-predict
        - "2048"
        - --cache-type-k
        - f16
        - --cache-type-v
        - f16
        - --flash-attn
        - "off"
        - --no-context-shift
        - --no-cache-prompt
        - --jinja
        - --api-key-file
        - /run/benchmark-auth/api-key
        - --timeout
        - "180"
        - --offline
        - --no-webui
        - --no-slots
        - --metrics
        - --log-disable
        env:
        - name: HOME
          value: /tmp
        - name: XDG_CACHE_HOME
          value: /tmp/cache
        - name: CUDA_CACHE_DISABLE
          value: "1"
        ports:
        - name: http
          containerPort: 8080
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: "2"
            memory: 16Gi
            ephemeral-storage: 256Mi
            nvidia.com/gpu: 1
          limits:
            cpu: "4"
            memory: 32Gi
            ephemeral-storage: 1Gi
            nvidia.com/gpu: 1
        volumeMounts:
        - name: models
          mountPath: /models
          readOnly: true
        - name: benchmark-auth
          mountPath: /run/benchmark-auth
          readOnly: true
        - name: temporary
          mountPath: /tmp
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: models
          readOnly: true
      - name: benchmark-auth
        secret:
          secretName: benchmark-api
          # Readable by UID10001 without fsGroup recursively changing local PV.
          defaultMode: 0444
          items:
          - key: api-key
            path: api-key
      - name: temporary
        emptyDir:
          sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: benchmark-runtime
  namespace: local-inference-benchmark
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: benchmark-runtime
  ports:
  - name: http
    port: 8080
    targetPort: http
