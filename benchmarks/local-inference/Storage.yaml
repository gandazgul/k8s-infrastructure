# Apply only AFTER a successful CUDA gate and approved narrow host mkdir.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-inference-benchmark-models
  labels:
    app.kubernetes.io/part-of: local-inference-benchmark
spec:
  capacity:
    storage: 60Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: local-inference-benchmark
    name: models
  local:
    path: /var/lib/local-inference-benchmark/models
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - k8s-control-plane
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models
  namespace: local-inference-benchmark
spec:
  accessModes:
  - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: ""
  volumeName: local-inference-benchmark-models
  resources:
    requests:
      storage: 60Gi
