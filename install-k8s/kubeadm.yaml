# https://github.com/kubernetes/kubernetes/blob/master/cmd/kubeadm/app/apis/kubeadm/v1beta4/types.go
# generated by kubeadm

apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
nodeRegistration:
  criSocket: unix:///var/run/crio/crio.sock
  name: k8s-control-plane
  # Remove all taints from the control plane to allow it to schedule pods since we are running a single machine/home lab
  taints: []
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
kubernetesVersion: v1.36.5
controllerManager:
  extraArgs:
  - name: bind-address
    value: "0.0.0.0"
scheduler:
  extraArgs:
  - name: bind-address
    value: "0.0.0.0"
apiServer:
  extraArgs:
    # This is important to allow any non-root ports to be used for NodePort
  - name: service-node-port-range
    value: 1025-32767
  - name: authorization-mode
    value: "Node,RBAC"
    # OIDC configuration
  - name: oidc-issuer-url
    value: "https://accounts.google.com"
  - name: oidc-client-id
    value: "399292359639-no3v1g6obqns0r1anqsb6hn520r6cu79.apps.googleusercontent.com"
  - name: oidc-username-claim
    value: "sub"
  - name: oidc-username-prefix
    value: "oidc:"
# This is super important, without this setting networking won't work
networking:
  dnsDomain: cluster.local
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/12
---
apiVersion: kubeproxy.config.k8s.io/v1alpha1
kind: KubeProxyConfiguration
bindAddress: 0.0.0.0
# This is super important, without this setting networking won't work
clusterCIDR: 10.244.0.0/16
---
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
cgroupDriver: systemd
